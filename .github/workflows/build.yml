name: Build ShareData
on:
  push:
    branches: [master, feat/deploy-vps]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: sharedata-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Pruebas y análisis
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v3
      - name: Acceso al registro
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/baldomerocho/go_sharedata:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/sharedata.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publicar imagen
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/baldomerocho/go_sharedata:${{ github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/sharedata.tar"
          docker push "$IMAGE"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sharedata-image-${{ github.sha }}
          path: ${{ runner.temp }}/sharedata.tar
          retention-days: 7
