name: Build ShareData
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: sharedata-build-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: sharedata-ci
          POSTGRES_DB: sharedata_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:sharedata-ci@127.0.0.1:5432/sharedata_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Pruebas y análisis
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v3
      - name: Acceso al registro
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ghcr.io/baldomerocho/go_sharedata:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/sharedata.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publicar imagen
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/baldomerocho/go_sharedata:${{ github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/sharedata.tar"
          docker push "$IMAGE"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: sharedata-image-${{ github.sha }}
          path: ${{ runner.temp }}/sharedata.tar
          retention-days: 7

  deploy:
    name: Desplegar en k3s
    needs: build
    if: >-
      github.repository == 'baldomerocho/go_sharedata' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, sharedata-deploy]
    permissions:
      contents: read
      actions: read
    concurrency:
      group: sharedata-vps-deploy
      cancel-in-progress: false
    timeout-minutes: 12
    steps:
      # No se ejecutan scripts del checkout en el VPS; el operador es root-owned.
      - name: Descargar, actualizar y verificar; restaurar si falla
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | sudo -n /usr/local/sbin/sharedata-release "$RUN_ID" "$REVISION"
