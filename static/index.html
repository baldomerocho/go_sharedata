<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ShareData</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --surface: #0f0f12;
  --surface2: #16161a;
  --surface3: #1c1c22;
  --border: #232329;
  --border2: #2c2c35;
  --text: #ececf0;
  --text2: #6e6e7a;
  --text3: #44444e;
  --gold: #c8a855;
  --gold2: #e0c872;
  --gold-dim: rgba(200,168,85,0.08);
  --gold-dim2: rgba(200,168,85,0.15);
  --red: #c0392b;
  --red-dim: rgba(192,57,43,0.1);
  --green: #2ecc71;
  --radius: 10px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  --sidebar-w: 280px;
  --header-h: 52px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold-dim2); color: var(--gold2); }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 30;
  transition: transform 0.25s ease;
}

.sidebar-header {
  height: var(--header-h);
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.logo {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
}

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.icon-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
  background: var(--gold-dim);
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 10px;
}

.sidebar-list::-webkit-scrollbar { width: 0; }

.ch-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.12s;
  margin-bottom: 1px;
  position: relative;
}

.ch-item:hover { background: var(--surface2); }

.ch-item.active {
  background: var(--gold-dim);
}

.ch-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text3);
  flex-shrink: 0;
  transition: background 0.15s;
}

.ch-item.active .ch-dot { background: var(--gold); }

.ch-name {
  flex: 1;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.15s;
}

.ch-item.active .ch-name { color: var(--text); }
.ch-item:hover .ch-name { color: var(--text); }

.ch-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.15s;
}

.ch-item:hover .ch-actions { opacity: 1; }

.ch-action {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s;
}

.ch-action:hover { color: var(--text2); background: var(--surface3); }
.ch-action.del:hover { color: var(--red); }

/* ── Main ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  height: var(--header-h);
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-btn {
  display: none;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
}

.status-dot.disconnected { background: var(--red); }

.header-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.name-input {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-family: var(--font);
  width: 130px;
  outline: none;
  transition: border-color 0.15s;
}

.name-input::placeholder { color: var(--text3); }
.name-input:focus { border-color: var(--gold); }

/* Toggle */
.toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}

.toggle-label {
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.toggle-track {
  width: 28px;
  height: 16px;
  border-radius: 8px;
  background: var(--surface3);
  border: 1px solid var(--border);
  position: relative;
  transition: all 0.2s;
}

.toggle-track.on {
  background: var(--gold);
  border-color: var(--gold);
}

.toggle-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text2);
  transition: all 0.2s;
}

.toggle-track.on::after {
  transform: translateX(12px);
  background: var(--bg);
}

.btn-clean {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 12px;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.12s;
  display: flex;
  align-items: center;
  gap: 5px;
  letter-spacing: 0.2px;
}

.btn-clean:hover {
  border-color: var(--red);
  color: var(--red);
  background: var(--red-dim);
}

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg {
  display: flex;
  gap: 14px;
  padding: 12px 14px;
  border-radius: var(--radius);
  transition: background 0.12s;
  position: relative;
}

.msg:hover { background: var(--surface); }
.msg:hover .msg-tools { opacity: 1; }

.msg-ini {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--surface3);
  color: var(--text2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 12px;
  flex-shrink: 0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.msg-body { flex: 1; min-width: 0; }

.msg-meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}

.msg-user {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.msg-time {
  font-size: 11px;
  color: var(--text3);
}

.msg-text {
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
}

.msg-text.is-large {
  max-height: 280px;
  overflow-y: auto;
  padding: 12px 14px;
  background: var(--surface2);
  border-radius: 8px;
  border: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.7;
}

.msg-img {
  margin-top: 8px;
  max-width: 420px;
  max-height: 400px;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: opacity 0.12s;
  display: block;
}

.msg-img:hover { opacity: 0.9; }

.msg-attach {
  margin-top: 8px;
  padding: 8px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text2);
}

.msg-attach a { color: var(--gold); text-decoration: none; }
.msg-attach a:hover { text-decoration: underline; }

.msg-tools {
  position: absolute;
  right: 8px;
  top: 8px;
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.12s;
}

.msg-tool {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s;
}

.msg-tool:hover { color: var(--text); border-color: var(--border2); background: var(--surface3); }
.msg-tool.del:hover { color: var(--red); border-color: var(--red); background: var(--red-dim); }

/* Input */
.input-bar {
  padding: 12px 20px 16px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.file-preview {
  display: none;
  padding: 8px 12px;
  margin-bottom: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text2);
  align-items: center;
  gap: 8px;
}

.file-preview.active { display: flex; }
.file-preview img { max-height: 48px; border-radius: 4px; }
.file-preview .fp-remove {
  margin-left: auto;
  cursor: pointer;
  color: var(--text3);
  font-size: 18px;
  background: none;
  border: none;
  line-height: 1;
  transition: color 0.12s;
}

.file-preview .fp-remove:hover { color: var(--red); }

.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.input-wrap {
  flex: 1;
  position: relative;
}

#msgInput {
  width: 100%;
  min-height: 42px;
  max-height: 180px;
  padding: 10px 40px 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 14px;
  font-family: var(--font);
  resize: none;
  outline: none;
  line-height: 1.5;
  transition: border-color 0.15s;
}

#msgInput:focus { border-color: var(--border2); }
#msgInput::placeholder { color: var(--text3); }

.clip-btn {
  position: absolute;
  right: 8px;
  bottom: 8px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.12s;
}

.clip-btn:hover { color: var(--text2); }

.send-btn {
  width: 42px;
  height: 42px;
  border-radius: var(--radius);
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.send-btn:hover { background: var(--gold); color: var(--bg); }

/* Overlays */
.drop-zone {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(200,168,85,0.04);
  border: 2px dashed var(--gold);
  z-index: 50;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.drop-zone.active { display: flex; }

.drop-zone span {
  background: var(--surface);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 14px 28px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.5px;
}

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 300;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}

.lightbox.active { display: flex; }
.lightbox img { max-width: 94vw; max-height: 94vh; border-radius: 6px; }

/* Modal */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

.overlay.active { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  width: 340px;
  max-width: 92vw;
}

.modal h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  letter-spacing: -0.2px;
}

.modal input[type="text"] {
  width: 100%;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  margin-bottom: 16px;
}

.modal input[type="text"]:focus { border-color: var(--gold); }

.modal-opts {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 18px;
}

.modal-opt {
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font);
  text-align: left;
  transition: all 0.12s;
}

.modal-opt:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
.modal-opt.sel { border-color: var(--red); color: var(--red); background: var(--red-dim); }

.modal-ft {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.mbtn {
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.12s;
}

.mbtn:hover { color: var(--text); border-color: var(--border2); }

.mbtn-gold {
  border-color: var(--gold);
  color: var(--gold);
}

.mbtn-gold:hover { background: var(--gold); color: var(--bg); }

.mbtn-red {
  border-color: var(--red);
  color: var(--red);
}

.mbtn-red:hover { background: var(--red); color: white; }

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 12px;
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  z-index: 400;
  letter-spacing: 0.2px;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  gap: 10px;
  font-size: 13px;
}

.empty svg { width: 40px; height: 40px; opacity: 0.25; stroke-width: 1; }

/* ── Mobile overlay backdrop ── */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 25;
}

.sidebar-backdrop.active { display: block; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
    z-index: 30;
    width: 280px;
  }

  .sidebar.open { transform: translateX(0); }

  .menu-btn { display: flex; }

  .header { padding: 0 14px; }
  .messages { padding: 12px 14px; }
  .input-bar { padding: 10px 14px 14px; }
  .name-input { width: 90px; font-size: 11px; }
  .toggle-label { display: none; }
  .btn-clean span { display: none; }
  .msg-img { max-width: 100%; }
}

/* ── Login ── */
.login {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.login.active { display: flex; }
.login-card {
  width: 100%;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 28px;
}
.login-logo {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  text-align: center;
  margin-bottom: 6px;
}
.login-sub {
  text-align: center;
  color: var(--text2);
  font-size: 12px;
  margin-bottom: 24px;
}
.login-field {
  display: block;
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.login-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border-color .15s;
}
.login-input:focus { border-color: var(--gold); }
.login-input.code { text-align: center; letter-spacing: 0.4em; font-size: 20px; font-family: var(--mono); }
.login-btn {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  background: var(--gold);
  color: #000;
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: background .15s;
}
.login-btn:hover:not(:disabled) { background: var(--gold2); }
.login-btn:disabled { opacity: .5; cursor: not-allowed; }
.login-link {
  display: block;
  margin-top: 14px;
  text-align: center;
  background: none;
  border: none;
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font);
}
.login-link:hover { color: var(--gold); }
.login-err {
  margin-top: 14px;
  padding: 10px 12px;
  background: var(--red-dim);
  border: 1px solid rgba(192,57,43,0.3);
  border-radius: 6px;
  color: #e8a39a;
  font-size: 12px;
  display: none;
}
.login-err.show { display: block; }
.logout-btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  font-family: var(--font);
  transition: all .15s;
}
.logout-btn:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="logo">ShareData</span>
    <button class="icon-btn" onclick="openNewChat()" title="Nuevo chat">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
  <div class="sidebar-list" id="chList"></div>
  <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px">
    <span id="sessionPhone" style="font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <button class="logout-btn" onclick="logout()">Salir</button>
  </div>
</div>

<div class="main">
  <div class="header">
    <div class="header-left">
      <button class="icon-btn menu-btn" id="menuBtn" onclick="toggleSidebar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="status-dot" id="statusDot"></div>
      <span class="header-title" id="headerTitle">General</span>
    </div>
    <div class="header-right">
      <input type="text" class="name-input" id="nameInput" placeholder="Tu nombre..." maxlength="50">
      <label class="toggle" id="enterToggle">
        <span class="toggle-label">Enter</span>
        <div class="toggle-track" id="toggleTrack"></div>
      </label>
      <button class="btn-clean" onclick="openCleanModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        <span>Limpiar</span>
      </button>
    </div>
  </div>

  <div class="messages" id="msgBox">
    <div class="empty" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span>Sin mensajes</span>
    </div>
  </div>

  <div class="input-bar">
    <div class="file-preview" id="filePrev">
      <span id="fpName"></span>
      <span id="fpSize"></span>
      <button class="fp-remove" onclick="rmFile()">&times;</button>
    </div>
    <div class="input-row">
      <div class="input-wrap">
        <textarea id="msgInput" placeholder="Escribe algo..." rows="1"></textarea>
        <button class="clip-btn" onclick="document.getElementById('fileIn').click()" title="Adjuntar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
      </div>
      <button class="send-btn" onclick="send()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <input type="file" id="fileIn" style="display:none" onchange="onFile(this)">
  </div>
</div>

<div class="drop-zone" id="dropZone"><span>Soltar archivo</span></div>

<div class="overlay" id="cleanModal">
  <div class="modal">
    <h3>Limpiar mensajes</h3>
    <div class="modal-opts">
      <button class="modal-opt" data-p="today" onclick="selPeriod(this)">Hoy</button>
      <button class="modal-opt" data-p="week" onclick="selPeriod(this)">Esta semana</button>
      <button class="modal-opt" data-p="month" onclick="selPeriod(this)">Este mes</button>
      <button class="modal-opt" data-p="year" onclick="selPeriod(this)">Este año</button>
      <button class="modal-opt" data-p="all" onclick="selPeriod(this)">Todo</button>
    </div>
    <div class="modal-ft">
      <button class="mbtn" onclick="closeModal('cleanModal')">Cancelar</button>
      <button class="mbtn mbtn-red" id="delBtn" onclick="doClean()" disabled>Eliminar</button>
    </div>
  </div>
</div>

<div class="overlay" id="newChModal">
  <div class="modal">
    <h3>Nuevo chat</h3>
    <input type="text" id="newChName" placeholder="Nombre...">
    <div class="modal-ft">
      <button class="mbtn" onclick="closeModal('newChModal')">Cancelar</button>
      <button class="mbtn mbtn-gold" onclick="doNewChat()">Crear</button>
    </div>
  </div>
</div>

<div class="overlay" id="renameModal">
  <div class="modal">
    <h3>Renombrar</h3>
    <input type="text" id="renameVal" placeholder="Nuevo nombre...">
    <div class="modal-ft">
      <button class="mbtn" onclick="closeModal('renameModal')">Cancelar</button>
      <button class="mbtn mbtn-gold" onclick="doRename()">Guardar</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lb" onclick="this.classList.remove('active')">
  <img id="lbImg">
</div>

<div class="toast" id="toast"></div>

<div class="login active" id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">ShareData</div>
    <div class="login-sub">Acceso seguro</div>

    <div id="loginStep1">
      <label class="login-field">Teléfono</label>
      <input type="tel" id="loginPhone" class="login-input" placeholder="+593987654321" autocomplete="tel">
      <button class="login-btn" id="loginSendBtn" onclick="doLogin()">Enviar código</button>
    </div>

    <div id="loginStep2" style="display:none">
      <label class="login-field">Código de verificación</label>
      <input type="text" id="loginCode" class="login-input code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
      <button class="login-btn" id="loginVerifyBtn" onclick="doVerify()">Verificar</button>
      <button class="login-link" onclick="backToPhone()">Cambiar número</button>
    </div>

    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<script>
let ws, chId = +localStorage.getItem('sd_ch') || 1, chs = [], period = null, pFile = null, renId = null;

// ── Auth ──
function getToken() { return localStorage.getItem('sd_token') || ''; }
function setToken(t) { localStorage.setItem('sd_token', t); }
function clearToken() { localStorage.removeItem('sd_token'); localStorage.removeItem('sd_phone'); }

async function api(url, opts={}) {
  opts.headers = opts.headers || {};
  const t = getToken();
  if (t) opts.headers['Authorization'] = 'Bearer ' + t;
  const r = await fetch(url, opts);
  if (r.status === 401) { clearToken(); showLogin(); throw new Error('Unauthorized'); }
  return r;
}

function showLogin() {
  document.getElementById('loginOverlay').classList.add('active');
  document.getElementById('loginStep1').style.display = '';
  document.getElementById('loginStep2').style.display = 'none';
  document.getElementById('loginErr').classList.remove('show');
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
}

function hideLogin() { document.getElementById('loginOverlay').classList.remove('active'); }

function loginErr(msg) {
  const e = document.getElementById('loginErr');
  e.textContent = msg; e.classList.add('show');
}

async function doLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  if (!phone) { loginErr('Ingresa un teléfono'); return; }
  const btn = document.getElementById('loginSendBtn');
  btn.disabled = true; btn.textContent = 'Enviando...';
  document.getElementById('loginErr').classList.remove('show');
  try {
    const r = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
    if (!r.ok) {
      const t = await r.text();
      loginErr(t || 'Error');
      btn.disabled = false; btn.textContent = 'Enviar código';
      return;
    }
    localStorage.setItem('sd_phone', phone);
    document.getElementById('loginStep1').style.display = 'none';
    document.getElementById('loginStep2').style.display = '';
    document.getElementById('loginCode').value = '';
    setTimeout(()=>document.getElementById('loginCode').focus(), 50);
  } catch(e) { loginErr('No se pudo contactar el servidor'); }
  btn.disabled = false; btn.textContent = 'Enviar código';
}

async function doVerify() {
  const phone = localStorage.getItem('sd_phone') || '';
  const code = document.getElementById('loginCode').value.trim();
  if (code.length !== 6) { loginErr('Código de 6 dígitos'); return; }
  const btn = document.getElementById('loginVerifyBtn');
  btn.disabled = true; btn.textContent = 'Verificando...';
  document.getElementById('loginErr').classList.remove('show');
  try {
    const r = await fetch('/api/auth/verify', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone, code})});
    if (!r.ok) {
      const t = await r.text();
      loginErr(t || 'Código inválido');
      btn.disabled = false; btn.textContent = 'Verificar';
      return;
    }
    const data = await r.json();
    setToken(data.token);
    document.getElementById('sessionPhone').textContent = data.phone;
    hideLogin();
    bootApp();
  } catch(e) { loginErr('Error de red'); }
  btn.disabled = false; btn.textContent = 'Verificar';
}

function backToPhone() {
  document.getElementById('loginStep1').style.display = '';
  document.getElementById('loginStep2').style.display = 'none';
  document.getElementById('loginErr').classList.remove('show');
}

function logout() {
  clearToken();
  showLogin();
}

// WS
function conn() {
  if (!getToken()) { showLogin(); return; }
  const W = `${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws?token=${encodeURIComponent(getToken())}`;
  ws = new WebSocket(W);
  ws.onopen = () => document.getElementById('statusDot').classList.remove('disconnected');
  ws.onclose = () => { document.getElementById('statusDot').classList.add('disconnected'); setTimeout(conn, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'new_message' && ev.message.channel_id === chId) addMsg(ev.message);
    else if (ev.type === 'messages_deleted' && ev.channel_id === chId) { loadMsgs(); toast('Mensajes eliminados'); }
    else if (ev.type === 'message_removed' && ev.message.channel_id === chId) {
      const el = document.querySelector(`[data-id="${ev.message.id}"]`);
      if (el) { el.remove(); chkEmpty(); }
    }
    else if (ev.type === 'channel_created' || ev.type === 'channel_updated') loadChs();
    else if (ev.type === 'channel_deleted') {
      if (ev.channel_id === chId) { chId = 1; localStorage.setItem('sd_ch','1'); loadMsgs(); }
      loadChs();
    }
    if (ev.type === 'channel_updated' && ev.channel?.id === chId) document.getElementById('headerTitle').textContent = ev.channel.name;
  };
}

// Channels
async function loadChs() {
  chs = await (await api('/api/channels')).json();
  const list = document.getElementById('chList');
  list.innerHTML = '';
  chs.forEach(c => {
    const d = document.createElement('div');
    d.className = 'ch-item' + (c.id === chId ? ' active' : '');
    d.onclick = e => { if (!e.target.closest('.ch-action')) switchCh(c.id); };
    const del = c.id === 1 ? '' : `<button class="ch-action del" onclick="delCh(${c.id})" title="Eliminar"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>`;
    d.innerHTML = `<div class="ch-dot"></div><span class="ch-name">${esc(c.name)}</span><div class="ch-actions"><button class="ch-action" onclick="openRename(${c.id},'${esc(c.name)}')" title="Renombrar"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>${del}</div>`;
    list.appendChild(d);
  });
  const cur = chs.find(c => c.id === chId);
  document.getElementById('headerTitle').textContent = cur ? cur.name : 'General';
}

function switchCh(id) { chId = id; localStorage.setItem('sd_ch', id); loadChs(); loadMsgs(); closeSidebar(); }

function openNewChat() { document.getElementById('newChName').value=''; showModal('newChModal'); setTimeout(()=>document.getElementById('newChName').focus(),50); }

async function doNewChat() {
  const n = document.getElementById('newChName').value.trim();
  if (!n) return;
  const c = await (await api('/api/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})).json();
  closeModal('newChModal'); await loadChs(); switchCh(c.id);
}

async function delCh(id) { if (!confirm('¿Eliminar este chat y sus mensajes?')) return; await api(`/api/channels/${id}`,{method:'DELETE'}); }

function openRename(id, name) { renId = id; document.getElementById('renameVal').value = name; showModal('renameModal'); setTimeout(()=>document.getElementById('renameVal').focus(),50); }

async function doRename() {
  const n = document.getElementById('renameVal').value.trim();
  if (!n || !renId) return;
  await api(`/api/channels/${renId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
  closeModal('renameModal');
}

// Messages
async function loadMsgs() {
  const data = await (await api(`/api/messages?channel_id=${chId}&limit=500`)).json();
  const box = document.getElementById('msgBox');
  box.innerHTML = '';
  if (data.messages?.length) { data.messages.forEach(m => addMsg(m, false)); scrollEnd(); }
  else chkEmpty();
}

function addMsg(m, scroll=true) {
  const box = document.getElementById('msgBox');
  const emp = document.getElementById('emptyState');
  if (emp) emp.remove();
  const d = document.createElement('div');
  d.className = 'msg'; d.dataset.id = m.id;
  const ini = m.username.substring(0,2);
  const t = new Date(m.created_at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  const dt = new Date(m.created_at).toLocaleDateString('es',{day:'numeric',month:'short'});
  const big = m.content?.length > 500;
  const isImg = m.has_file && m.file_data?.startsWith('data:image/');

  let file = '';
  if (m.has_file && m.file_name) {
    if (isImg) file = `<img class="msg-img" src="${m.file_data}" onclick="document.getElementById('lbImg').src=this.src;document.getElementById('lb').classList.add('active')" loading="lazy">`;
    else file = `<div class="msg-attach"><a href="#" onclick="dl('${esc(m.file_name)}','${esc(m.file_data)}');return false">${esc(m.file_name)}</a><span>${fmtSz(m.file_size)}</span></div>`;
  }

  let tools = '';
  if (m.content) tools += `<button class="msg-tool" onclick="cpTxt(${m.id})" title="Copiar texto"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>`;
  if (isImg) tools += `<button class="msg-tool" onclick="cpImg(${m.id})" title="Copiar imagen"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>`;
  tools += `<button class="msg-tool del" onclick="delMsg(${m.id})" title="Eliminar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>`;

  d.innerHTML = `<div class="msg-ini">${esc(ini)}</div><div class="msg-body"><div class="msg-meta"><span class="msg-user">${esc(m.username)}</span><span class="msg-time">${dt} ${t}</span></div>${m.content?`<div class="msg-text${big?' is-large':''}">${esc(m.content)}</div>`:''}${file}</div><div class="msg-tools">${tools}</div>`;
  box.appendChild(d);
  if (scroll) scrollEnd();
}

function chkEmpty() {
  const box = document.getElementById('msgBox');
  if (!box.querySelector('.msg')) box.innerHTML = `<div class="empty" id="emptyState"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:40px;height:40px;opacity:.25;stroke-width:1"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span>Sin mensajes</span></div>`;
}

// Send
function send() {
  const inp = document.getElementById('msgInput');
  const txt = inp.value.trim();
  const user = document.getElementById('nameInput').value.trim() || 'Anónimo';
  if (!txt && !pFile) return;
  if (ws?.readyState === 1) ws.send(JSON.stringify({type:'new_message',message:{channel_id:chId,username:user,content:txt,has_file:!!pFile,file_name:pFile?.name||'',file_size:pFile?.size||0,file_data:pFile?.data||''}}));
  inp.value = ''; inp.style.height = 'auto'; rmFile();
}

// Files
function onFile(inp) {
  const f = inp.files[0]; if (!f) return;
  if (f.size > 20*1024*1024) { toast('Max 20MB'); inp.value=''; return; }
  const r = new FileReader();
  r.onload = () => setFile(f.name, f.size, r.result);
  r.readAsDataURL(f); inp.value='';
}

function setFile(name, size, data) {
  pFile = {name,size,data};
  const p = document.getElementById('filePrev');
  const old = p.querySelector('img'); if (old) old.remove();
  if (data.startsWith('data:image/')) { const i=document.createElement('img'); i.src=data; p.insertBefore(i,p.firstChild); }
  document.getElementById('fpName').textContent = name;
  document.getElementById('fpSize').textContent = fmtSz(size);
  p.classList.add('active');
}

function rmFile() {
  pFile = null;
  const p = document.getElementById('filePrev');
  p.classList.remove('active');
  const i = p.querySelector('img'); if (i) i.remove();
}

function dl(name, url) { const a=document.createElement('a'); a.href=url; a.download=name; a.click(); }

// Paste
document.addEventListener('paste', e => {
  for (const it of (e.clipboardData?.items||[])) {
    if (it.type.startsWith('image/')) {
      e.preventDefault();
      const f = it.getAsFile(); if (!f) return;
      if (f.size > 20*1024*1024) { toast('Max 20MB'); return; }
      const r = new FileReader();
      r.onload = () => setFile(`screenshot_${Date.now()}.${f.type.split('/')[1]||'png'}`, f.size, r.result);
      r.readAsDataURL(f); return;
    }
  }
});

// Copy
async function cpTxt(id) {
  const el = document.querySelector(`[data-id="${id}"] .msg-text`);
  if (!el) return;
  try { await navigator.clipboard.writeText(el.textContent); toast('Texto copiado'); }
  catch { const t=document.createElement('textarea'); t.value=el.textContent; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); toast('Texto copiado'); }
}

async function cpImg(id) {
  const img = document.querySelector(`[data-id="${id}"] .msg-img`);
  if (!img) return;
  try {
    const b = await (await fetch(img.src)).blob();
    const bm = await createImageBitmap(b);
    const c = document.createElement('canvas'); c.width=bm.width; c.height=bm.height;
    c.getContext('2d').drawImage(bm,0,0);
    c.toBlob(async pb => {
      try { await navigator.clipboard.write([new ClipboardItem({'image/png':pb})]); toast('Imagen copiada'); }
      catch { toast('No se pudo copiar'); }
    },'image/png');
  } catch { toast('No se pudo copiar'); }
}

// Delete
async function delMsg(id) { await api(`/api/messages/delete/${id}`,{method:'DELETE'}); }

function openCleanModal() { period=null; document.querySelectorAll('.modal-opt').forEach(b=>b.classList.remove('sel')); document.getElementById('delBtn').disabled=true; showModal('cleanModal'); }
function selPeriod(b) { document.querySelectorAll('.modal-opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); period=b.dataset.p; document.getElementById('delBtn').disabled=false; }
function doClean() { if (!period) return; if (ws?.readyState===1) ws.send(JSON.stringify({type:'delete_messages',period,channel_id:chId})); closeModal('cleanModal'); }

// Sidebar mobile
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarBackdrop').classList.toggle('active'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('active'); }
document.getElementById('sidebarBackdrop').onclick = closeSidebar;

// Modal
function showModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target===e.currentTarget) o.classList.remove('active'); }));

// Helpers
function scrollEnd() { const c=document.getElementById('msgBox'); requestAnimationFrame(()=>c.scrollTop=c.scrollHeight); }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtSz(b) { return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'; }
function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

// Enter toggle
let enterSend = localStorage.getItem('sd_enter')==='true';
const tt = document.getElementById('toggleTrack');
function updToggle() { tt.classList.toggle('on',enterSend); }
updToggle();
document.getElementById('enterToggle').onclick = () => { enterSend=!enterSend; localStorage.setItem('sd_enter',enterSend); updToggle(); };

// Textarea
const ta = document.getElementById('msgInput');
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,180)+'px'; });
ta.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    if (enterSend && !e.shiftKey) { e.preventDefault(); send(); }
    else if (!enterSend && (e.ctrlKey||e.metaKey)) { e.preventDefault(); send(); }
  }
});

// Modal kbd
document.getElementById('newChName').addEventListener('keydown', e => { if(e.key==='Enter')doNewChat(); if(e.key==='Escape')closeModal('newChModal'); });
document.getElementById('renameVal').addEventListener('keydown', e => { if(e.key==='Enter')doRename(); if(e.key==='Escape')closeModal('renameModal'); });

// Drag & Drop
let dc = 0;
const dz = document.getElementById('dropZone');
document.addEventListener('dragenter', e => { e.preventDefault(); dc++; if(dc===1) dz.classList.add('active'); });
document.addEventListener('dragleave', e => { e.preventDefault(); dc--; if(dc===0) dz.classList.remove('active'); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dc=0; dz.classList.remove('active');
  const f=e.dataTransfer?.files?.[0]; if(!f) return;
  if(f.size>20*1024*1024){toast('Max 20MB');return;}
  const r=new FileReader(); r.onload=()=>setFile(f.name,f.size,r.result); r.readAsDataURL(f);
});

// Username
const ni = document.getElementById('nameInput');
ni.value = localStorage.getItem('sd_user') || '';
ni.addEventListener('input', () => localStorage.setItem('sd_user', ni.value));

// Init
function bootApp() {
  hideLogin();
  const saved = localStorage.getItem('sd_phone');
  if (saved) document.getElementById('sessionPhone').textContent = saved;
  conn(); loadChs(); loadMsgs();
}

if (getToken()) bootApp();
else showLogin();

document.getElementById('loginPhone').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
document.getElementById('loginCode').addEventListener('keydown', e => { if (e.key==='Enter') doVerify(); });
document.getElementById('loginCode').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,6);
  if (e.target.value.length === 6) doVerify();
});
const savedPhone = localStorage.getItem('sd_phone');
if (savedPhone) document.getElementById('loginPhone').value = savedPhone;
</script>
</body>
</html>
