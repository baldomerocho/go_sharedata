<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ShareData</title>
<script>
(() => {
  const t = localStorage.getItem('sd_theme') || 'system';
  const resolved = t === 'system'
    ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : t;
  document.documentElement.dataset.theme = resolved;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root {
  color-scheme: dark;
  --bg: #0d0d12;
  --bg-elev: #12121a;
  --surface: #15151c;
  --surface2: #1c1c25;
  --surface3: #26262f;
  --surface-hover: rgba(255,255,255,0.035);
  --border: #26262f;
  --border2: #3a3a46;
  --border-strong: #58586a;
  --text: #f1f1f4;
  --text2: #b4b4c0;
  --text3: #7c7c8a;
  --gold: #d4b25e;
  --gold2: #e8ca7c;
  --gold-dim: rgba(212,178,94,0.09);
  --gold-dim2: rgba(212,178,94,0.20);
  --gold-glow: rgba(212,178,94,0.30);
  --on-gold: #0f0f14;
  --red: #ef5050;
  --red-dim: rgba(239,80,80,0.10);
  --red-border: rgba(239,80,80,0.38);
  --green: #3ecf8e;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.35);
  --shadow-sm: 0 2px 6px rgba(0,0,0,0.35);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.55);
  --ring: 0 0 0 3px var(--gold-glow);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
  --sidebar-w: 272px;
  --header-h: 56px;
  --t-fast: 120ms cubic-bezier(.4,0,.2,1);
  --t-base: 180ms cubic-bezier(.4,0,.2,1);
  --t-slow: 280ms cubic-bezier(.4,0,.2,1);
}

[data-theme="light"] {
  color-scheme: light;
  --bg: #f8f8f6;
  --bg-elev: #ffffff;
  --surface: #ffffff;
  --surface2: #f3f3f1;
  --surface3: #e9e9e6;
  --surface-hover: rgba(15,15,20,0.04);
  --border: #e4e4de;
  --border2: #cacac4;
  --border-strong: #8a8a84;
  --text: #18181b;
  --text2: #3a3a40;
  --text3: #72727c;
  --gold: #8a6a1f;
  --gold2: #a0812c;
  --gold-dim: rgba(138,106,31,0.07);
  --gold-dim2: rgba(138,106,31,0.15);
  --gold-glow: rgba(138,106,31,0.22);
  --on-gold: #ffffff;
  --red: #b91c1c;
  --red-dim: rgba(185,28,28,0.06);
  --red-border: rgba(185,28,28,0.30);
  --green: #047857;
  --shadow-xs: 0 1px 2px rgba(15,15,20,0.06);
  --shadow-sm: 0 2px 6px rgba(15,15,20,0.06);
  --shadow-md: 0 8px 24px rgba(15,15,20,0.08);
  --shadow-lg: 0 24px 60px rgba(15,15,20,0.14);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold-dim2); color: var(--text); }
html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss01", "ss03";
  letter-spacing: -0.005em;
}

button, input, textarea { font-family: inherit; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }

/* ============ SIDEBAR ============ */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 30;
  transition: transform var(--t-slow);
}

.sidebar-header {
  height: var(--header-h);
  padding: 0 14px 0 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.logo {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 9px;
}
.logo::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 10px var(--gold-glow);
}

#lockBadge {
  display: none;
  align-items: center;
  gap: 4px;
  color: var(--gold);
  padding: 3px 8px;
  background: var(--gold-dim);
  border: 1px solid var(--gold-dim2);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 500;
  margin-left: auto;
}

.icon-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
  flex-shrink: 0;
}
.icon-btn:hover {
  color: var(--gold);
  background: var(--gold-dim);
  border-color: var(--gold-dim2);
}

.sidebar-section {
  padding: 14px 20px 4px;
  display: flex;
  align-items: center;
}
.sidebar-section-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 10px 8px;
  scrollbar-width: thin;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ch-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
  margin-bottom: 1px;
  position: relative;
}
.ch-item:hover { background: var(--surface2); }
.ch-item.active {
  background: var(--gold-dim);
}
.ch-item.active::before {
  content: '';
  position: absolute;
  left: -10px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: 0 2px 2px 0;
  background: var(--gold);
}

.ch-hash {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--text3);
  font-weight: 400;
  width: 14px;
  flex-shrink: 0;
  text-align: center;
  transition: color var(--t-fast);
}
.ch-item.active .ch-hash { color: var(--gold); }

.ch-name {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color var(--t-fast);
  letter-spacing: -0.005em;
}
.ch-item.active .ch-name,
.ch-item:hover .ch-name { color: var(--text); }

.ch-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--t-fast);
}
.ch-item:hover .ch-actions { opacity: 1; }

.ch-action {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--t-fast), background var(--t-fast);
}
.ch-action:hover { color: var(--text); background: var(--surface3); }
.ch-action.del:hover { color: var(--red); background: var(--red-dim); }

/* Sidebar footer */
.sidebar-footer {
  border-top: 1px solid var(--border);
  padding: 8px 10px 10px;
}
.session-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 6px;
  border-radius: 8px;
}
.session-ava {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  color: var(--on-gold);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  letter-spacing: 0;
  box-shadow: 0 2px 4px var(--gold-glow);
}
.session-phone {
  flex: 1;
  font-size: 11.5px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.session-actions { display: flex; gap: 4px; }
.session-btn {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.session-btn:hover { color: var(--text); background: var(--surface2); border-color: var(--border); }
.session-btn.danger:hover { color: var(--red); background: var(--red-dim); border-color: var(--red-border); }

/* ============ MAIN ============ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
  position: relative;
}

/* New messages indicator */
.new-msgs {
  position: absolute;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--gold);
  color: var(--on-gold);
  padding: 8px 14px 8px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  cursor: pointer;
  border: none;
  font-family: var(--font);
  box-shadow: var(--shadow-md), 0 0 0 4px var(--gold-glow);
  display: flex;
  align-items: center;
  gap: 7px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-base), transform var(--t-base);
  z-index: 20;
}
.new-msgs.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
  animation: newMsgPulse 1.6s ease-in-out infinite;
}
.new-msgs:hover { background: var(--gold2); }
.new-msgs svg { flex-shrink: 0; }
@keyframes newMsgPulse {
  0%, 100% { box-shadow: var(--shadow-md), 0 0 0 4px var(--gold-glow); }
  50% { box-shadow: var(--shadow-md), 0 0 0 10px transparent; }
}

.header {
  height: var(--header-h);
  padding: 0 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.menu-btn { display: none; }

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  position: relative;
  flex-shrink: 0;
  transition: background var(--t-base);
}
.status-dot::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: var(--green);
  opacity: 0.4;
  animation: pulse 2s ease-out infinite;
}
.status-dot.disconnected { background: var(--red); }
.status-dot.disconnected::after { background: var(--red); animation: none; opacity: 0.22; }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0; }
  50% { transform: scale(1.7); opacity: 0.35; }
}

.header-title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
}
.header-title::before {
  content: '#';
  color: var(--text3);
  margin-right: 5px;
  font-weight: 400;
  font-family: var(--mono);
  font-size: 14px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.name-input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 12px;
  width: 140px;
  outline: none;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.name-input::placeholder { color: var(--text3); }
.name-input:hover { border-color: var(--border2); }
.name-input:focus { border-color: var(--gold); background: var(--bg-elev); }

.toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
  padding: 4px 8px;
  border-radius: 7px;
  transition: background var(--t-fast);
}
.toggle:hover { background: var(--surface2); }
.toggle-label {
  font-size: 10.5px;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
}
.toggle-track {
  width: 28px;
  height: 16px;
  border-radius: 999px;
  background: var(--surface3);
  border: 1px solid var(--border);
  position: relative;
  transition: background var(--t-base), border-color var(--t-base);
}
.toggle-track.on { background: var(--gold); border-color: var(--gold); }
.toggle-track::after {
  content: '';
  position: absolute;
  top: 1px;
  left: 1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text2);
  transition: transform var(--t-base), background var(--t-base);
}
.toggle-track.on::after { transform: translateX(12px); background: var(--on-gold); }

.btn-clean {
  padding: 6px 10px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-clean:hover {
  border-color: var(--red-border);
  color: var(--red);
  background: var(--red-dim);
}

/* ============ MESSAGES ============ */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.messages::-webkit-scrollbar-thumb:hover { background: var(--border2); }

.msg {
  display: flex;
  gap: 12px;
  padding: 7px 12px;
  border-radius: 8px;
  transition: background var(--t-fast);
  position: relative;
  animation: msgIn 180ms cubic-bezier(.4,0,.2,1);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg:hover { background: var(--surface-hover); }
.msg:hover .msg-tools { opacity: 1; transform: translateY(0); }

.msg.grouped { padding-top: 1px; padding-bottom: 1px; margin-top: -2px; }
.msg.grouped .msg-ini { visibility: hidden; height: 0; align-self: center; }
.msg.grouped .msg-meta { display: none; }
.msg.grouped .msg-body::before {
  content: attr(data-time);
  position: absolute;
  left: 14px;
  top: 8px;
  font-size: 10px;
  color: var(--text3);
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity var(--t-fast);
  pointer-events: none;
}
.msg.grouped:hover .msg-body::before { opacity: 1; }

.msg-ini {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 11.5px;
  flex-shrink: 0;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--av1, #64748b), var(--av2, #334155));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10), 0 1px 2px rgba(0,0,0,0.25);
  letter-spacing: 0;
}

.msg-body { flex: 1; min-width: 0; position: relative; }
.msg-meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}
.msg-user {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
}
.msg-time {
  font-size: 11px;
  color: var(--text3);
  font-variant-numeric: tabular-nums;
}
.msg-text {
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
}
.msg-text.is-large {
  max-height: 280px;
  overflow-y: auto;
  padding: 10px 12px;
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
  margin-top: 4px;
}
.msg-img {
  margin-top: 6px;
  max-width: 420px;
  max-height: 400px;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: zoom-in;
  transition: opacity var(--t-fast);
  display: block;
}
.msg-img:hover { opacity: 0.92; }

.msg-attach {
  margin-top: 6px;
  padding: 8px 10px 8px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text2);
  transition: border-color var(--t-fast);
  max-width: 440px;
  min-width: 240px;
}
.msg-attach:hover { border-color: var(--border2); }
/* Adjunto aún no descargado: se atenúa el icono suelto para que se lea como
   marcador de posición. Con blurhash no se atenúa: el fondo debe verse con su
   color real, y es además lo que asume el cálculo de contraste de la tinta. */
.msg-attach.lazy .att-thumb:not(.bh) { opacity: 0.55; }
.msg-attach.lazy[data-loading="1"] { border-color: var(--gold-dim2); }
.msg-attach-sz { color: var(--text3); font-variant-numeric: tabular-nums; flex-shrink: 0; font-size: 11px; }

.att-thumb {
  width: 50px;
  height: 50px;
  border-radius: 7px;
  flex-shrink: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--text3);
}
.att-thumb img, .att-thumb canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.att-thumb.pdf-thumb { background: #fff; }
[data-theme="light"] .att-thumb.pdf-thumb { background: #fff; }

/* Blurhash de fondo: da una pista del contenido sin descargarlo. Se muestra a
   plena intensidad; la legibilidad se resuelve eligiendo en JS la tinta que más
   contrasta con esa imagen, más un halo que la despega del fondo. */
.att-thumb.bh { position: relative; }
.att-thumb.bh::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: var(--bh);
  background-size: cover;
  background-position: center;
}
.att-thumb.bh > svg {
  position: relative;
  z-index: 1;
  color: var(--bh-ink);
  filter: drop-shadow(0 1px 1.5px var(--bh-halo));
}

.att-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.att-name {
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12.5px;
  letter-spacing: -0.005em;
}

.att-actions { display: flex; gap: 4px; flex-shrink: 0; }
.att-btn {
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font);
}
.att-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
.att-btn.primary { border-color: var(--gold); color: var(--gold); }
.att-btn.primary:hover { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }

.msg-audio-wrap {
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 440px;
}

.msg-tools {
  position: absolute;
  right: 10px;
  top: -6px;
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transform: translateY(-3px);
  transition: opacity var(--t-fast), transform var(--t-fast);
}
.msg-tool {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--t-fast), background var(--t-fast);
}
.msg-tool:hover { color: var(--text); background: var(--surface2); }
.msg-tool.del:hover { color: var(--red); background: var(--red-dim); }

/* ============ INPUT ============ */
.input-bar {
  padding: 12px 20px 16px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.file-preview {
  display: none;
  padding: 8px 12px;
  margin-bottom: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text2);
  align-items: center;
  gap: 10px;
}
.file-preview.active { display: flex; }
.file-preview img { max-height: 44px; border-radius: 4px; }

/* Lista de adjuntos en cola */
.fp-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
  min-width: 0;
  max-height: 118px;
  overflow-y: auto;
}
.fp-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  max-width: 100%;
  padding: 4px 4px 4px 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.fp-chip img { max-height: 26px; max-width: 34px; object-fit: cover; border-radius: 3px; }
.fp-chip-name {
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}
.fp-chip-sz { color: var(--text3); font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.fp-chip-x {
  flex-shrink: 0;
  width: 19px;
  height: 19px;
  border: none;
  background: none;
  color: var(--text3);
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), color var(--t-fast);
}
.fp-chip-x:hover { color: var(--red); background: var(--red-dim); }
.file-preview .fp-remove {
  margin-left: auto;
  cursor: pointer;
  color: var(--text3);
  width: 24px;
  height: 24px;
  border-radius: 5px;
  background: none;
  border: none;
  line-height: 1;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), color var(--t-fast);
}
.file-preview .fp-remove:hover { color: var(--red); background: var(--red-dim); }

.input-row {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px 6px 6px 14px;
  transition: border-color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
}
.input-row:focus-within {
  border-color: var(--gold);
  background: var(--bg-elev);
}
#msgInput:focus,
#msgInput:focus-visible { outline: none; box-shadow: none; }

.input-wrap { flex: 1; position: relative; display: flex; align-items: center; }

#msgInput {
  width: 100%;
  min-height: 34px;
  max-height: 180px;
  padding: 7px 0;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 14px;
  resize: none;
  outline: none;
  line-height: 1.5;
  letter-spacing: -0.005em;
}
#msgInput::placeholder { color: var(--text3); }

.clip-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), color var(--t-fast);
  flex-shrink: 0;
}
.clip-btn:hover { color: var(--text); background: var(--surface2); }

.send-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: none;
  background: var(--gold);
  color: var(--on-gold);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
  flex-shrink: 0;
  box-shadow: 0 2px 6px var(--gold-glow);
}
.send-btn:hover { background: var(--gold2); transform: translateY(-1px); box-shadow: 0 4px 10px var(--gold-glow); }
.send-btn:active { transform: translateY(0); }

/* ============ INDICADOR DE CARGA ============ */
.load-bar {
  position: absolute;
  top: var(--header-h);
  left: 0;
  right: 0;
  height: 2px;
  overflow: hidden;
  opacity: 0;
  transition: opacity var(--t-fast);
  pointer-events: none;
  z-index: 20;
}
.load-bar.active { opacity: 1; }
.load-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transform: translateX(-100%);
  animation: loadSlide 1.1s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes loadSlide { to { transform: translateX(100%); } }

.load-chip {
  position: absolute;
  top: calc(var(--header-h) + 12px);
  left: 50%;
  transform: translate(-50%, -8px);
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 13px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 999px;
  box-shadow: var(--shadow-md);
  color: var(--text2);
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-base), transform var(--t-base);
  z-index: 21;
}
.load-chip.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .load-bar::after { animation-duration: 2.4s; }
  .load-chip { transition: opacity var(--t-base); }
}

/* ============ OVERLAYS ============ */
.drop-zone {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(13,13,18,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 50;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
[data-theme="light"] .drop-zone { background: rgba(248,248,246,0.7); }
.drop-zone.active { display: flex; }
.drop-zone span {
  background: var(--surface);
  border: 2px dashed var(--gold);
  color: var(--gold);
  padding: 20px 32px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
  box-shadow: var(--shadow-lg);
}

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.94);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
.lightbox.active { display: flex; }
.lightbox img {
  max-width: 94vw;
  max-height: 94vh;
  border-radius: 8px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.8);
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
[data-theme="light"] .overlay { background: rgba(15,15,20,0.35); }
.overlay.active { display: flex; animation: fadeIn var(--t-base); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  width: 360px;
  max-width: 92vw;
  box-shadow: var(--shadow-lg);
  animation: modalIn var(--t-slow);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 18px;
  letter-spacing: -0.01em;
  color: var(--text);
}

.modal input[type="text"] {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  margin-bottom: 18px;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.modal input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); }

.modal-opts {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 18px;
}
.modal-opt {
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  text-align: left;
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
}
.modal-opt:hover { border-color: var(--border2); color: var(--text); }
.modal-opt.sel { border-color: var(--red); color: var(--red); background: var(--red-dim); }

.modal-ft { display: flex; justify-content: flex-end; gap: 8px; }

.mbtn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast);
}
.mbtn:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

.mbtn-gold {
  border-color: var(--gold);
  background: var(--gold);
  color: var(--on-gold);
}
.mbtn-gold:hover { background: var(--gold2); border-color: var(--gold2); color: var(--on-gold); }

.mbtn-red {
  border-color: var(--red);
  color: var(--red);
}
.mbtn-red:hover:not(:disabled) { background: var(--red); color: #fff; border-color: var(--red); }
.mbtn-red:disabled { opacity: 0.5; cursor: not-allowed; }

/* Toast */
.toast {
  position: fixed;
  bottom: 88px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 500;
  opacity: 0;
  transition: opacity var(--t-slow), transform var(--t-slow);
  pointer-events: none;
  z-index: 400;
  box-shadow: var(--shadow-md);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Empty */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  gap: 8px;
  font-size: 13px;
}
.empty-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  margin-bottom: 6px;
}
.empty-title { font-weight: 500; color: var(--text2); font-size: 13.5px; }
.empty-sub { font-size: 12px; color: var(--text3); }

/* Mobile backdrop */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
  z-index: 25;
}
.sidebar-backdrop.active { display: block; }

/* Mobile */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
    z-index: 30;
  }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .menu-btn { display: flex; }
  .header { padding: 0 14px; }
  .messages { padding: 12px 14px; }
  .input-bar { padding: 10px 14px 14px; }
  .name-input { width: 96px; font-size: 11px; }
  .toggle-label { display: none; }
  .btn-clean span { display: none; }
  .msg-img { max-width: 100%; }
}

/* ============ LOGIN ============ */
.login {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.login.active { display: flex; }
.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 28px 26px;
  box-shadow: var(--shadow-lg);
}
.login-logo {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text);
  text-align: center;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.login-logo::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold-glow);
}
.login-sub {
  text-align: center;
  color: var(--text3);
  font-size: 12px;
  margin-bottom: 22px;
}
.login-steps {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 26px;
}
.login-steps span {
  width: 28px;
  height: 3px;
  border-radius: 2px;
  background: var(--surface3);
  transition: background var(--t-base), width var(--t-base);
}
.login-steps span.done { background: var(--gold); }
.login-steps span.active { background: var(--gold); width: 36px; }

.login-field {
  display: block;
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  font-weight: 500;
}
.login-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.login-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); }

/* Código de país (combobox con búsqueda) + número */
.phone-row { display: flex; gap: 8px; align-items: flex-start; }
.cc-combo {
  position: relative;
  width: 92px;
  flex-shrink: 0;
  transition: width var(--t-base);
}
/* Al buscar hace falta sitio para escribir el nombre del país */
.cc-combo:focus-within { width: 168px; }
.cc-input {
  width: 100%;
  font-variant-numeric: tabular-nums;
}
.phone-input { flex: 1; min-width: 0; }

.cc-list {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 268px;
  max-height: 244px;
  overflow-y: auto;
  margin: 0;
  padding: 4px;
  list-style: none;
  background: var(--bg-elev);
  border: 1px solid var(--border2);
  border-radius: 9px;
  box-shadow: var(--shadow-lg);
  z-index: 30;
}
.cc-list.open { display: block; }
.cc-opt {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
}
.cc-opt-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-opt-cc { color: var(--text3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
.cc-opt[aria-selected="true"], .cc-opt:hover {
  background: var(--gold-dim);
  color: var(--text);
}
.cc-opt[aria-selected="true"] .cc-opt-cc { color: var(--gold); }
.cc-opt mark { background: none; color: var(--gold); font-weight: 600; }
.cc-empty { padding: 10px; font-size: 12px; color: var(--text3); text-align: center; }
.login-input.code {
  text-align: center;
  letter-spacing: 0.4em;
  font-size: 22px;
  font-family: var(--mono);
  padding: 14px;
}
.login-btn {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  background: var(--gold);
  color: var(--on-gold);
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background var(--t-fast), transform var(--t-fast);
  box-shadow: 0 2px 8px var(--gold-glow);
}
.login-btn:hover:not(:disabled) { background: var(--gold2); transform: translateY(-1px); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.login-link {
  display: block;
  margin: 12px auto 0;
  background: none;
  border: none;
  color: var(--text3);
  font-size: 12px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 6px;
  transition: color var(--t-fast), background var(--t-fast);
}
.login-link:hover { color: var(--gold); background: var(--gold-dim); }
.login-err {
  margin-top: 14px;
  padding: 10px 12px;
  background: var(--red-dim);
  border: 1px solid var(--red-border);
  border-radius: 8px;
  color: var(--red);
  font-size: 12px;
  display: none;
}
.login-err.show { display: block; animation: shake 400ms ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-4px); }
  40%, 80% { transform: translateX(4px); }
}

/* ============ THEME SWITCHER ============ */
.theme-seg {
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  margin: 8px 10px 4px;
}
.theme-opt {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text3);
  padding: 6px 0;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
}
.theme-opt:hover { color: var(--text2); }
.theme-opt.active {
  background: var(--bg-elev);
  color: var(--gold);
  box-shadow: var(--shadow-xs);
}

/* ============ CONTEXT MENU ============ */
.ctx-menu {
  position: fixed;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  min-width: 220px;
  max-width: 280px;
  box-shadow: var(--shadow-lg);
  z-index: 500;
  display: none;
  animation: ctxIn 120ms cubic-bezier(.4,0,.2,1);
}
.ctx-menu.active { display: block; }
@keyframes ctxIn {
  from { opacity: 0; transform: scale(0.97) translateY(-3px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.ctx-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  font-size: 13px;
  color: var(--text2);
  border-radius: 6px;
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
  user-select: none;
  line-height: 1.1;
}
.ctx-item:hover { background: var(--surface2); color: var(--text); }
.ctx-item.danger:hover { background: var(--red-dim); color: var(--red); }
.ctx-item svg { flex-shrink: 0; color: var(--text3); transition: color var(--t-fast); }
.ctx-item:hover svg { color: currentColor; }
.ctx-item span.lbl { flex: 1; }
.ctx-item .hint {
  font-size: 10.5px;
  color: var(--text3);
  font-family: var(--mono);
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 2px 5px;
  border-radius: 4px;
}
.ctx-sep { height: 1px; background: var(--border); margin: 4px 4px; }

/* ============ PENDING / SPIN ============ */
.spin {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  display: inline-block;
  flex-shrink: 0;
}
.spin.sm { width: 10px; height: 10px; border-width: 1.5px; }
@keyframes spin { to { transform: rotate(360deg); } }

.msg.pending { opacity: 0.72; }
.msg.pending .msg-text { color: var(--text2); }
.msg.pending .pending-time {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text3);
  font-style: italic;
}
.msg.pending.failed { opacity: 0.58; }
.msg.pending.failed .msg-ini { filter: grayscale(1); }
.msg.pending.failed .pending-time { color: var(--red); font-style: normal; }
.msg.pending.failed .pending-time .spin { display: none; }
.pending-attach {
  background: var(--surface);
  border: 1px dashed var(--border2) !important;
}

/* ============ AUDIO / VIDEO ============ */
.msg-audio {
  display: block;
  margin-top: 6px;
  width: 360px;
  max-width: 100%;
  height: 40px;
}
.msg-audio::-webkit-media-controls-panel { background: var(--surface2); }
.msg-video {
  display: block;
  margin-top: 6px;
  max-width: 420px;
  max-height: 400px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #000;
}

/* kebab = single hover/tap trigger */

<script>
let ws, chId = +localStorage.getItem('sd_ch') || 1, chs = [], period = null, pFiles = [], renId = null;

// ── Theme ──
function setTheme(mode) {
  localStorage.setItem('sd_theme', mode);
  applyTheme();
}
function applyTheme() {
  const mode = localStorage.getItem('sd_theme') || 'system';
  const resolved = mode === 'system'
    ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : mode;
  document.documentElement.dataset.theme = resolved;
  document.querySelectorAll('.theme-opt').forEach(b => b.classList.toggle('active', b.dataset.t === mode));
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
  if ((localStorage.getItem('sd_theme') || 'system') === 'system') applyTheme();
});
applyTheme();

// ── Login step indicator ──
function setLoginStep(n) {
  const steps = document.querySelectorAll('#loginSteps span');
  steps.forEach((s, i) => {
    s.classList.remove('active', 'done');
    if (i + 1 < n) s.classList.add('done');
    else if (i + 1 === n) s.classList.add('active');
  });
}

// ── Avatar gradient (deterministic hash) ──
const AV_PAIRS = [
  ['#fb7185','#be123c'], ['#fbbf24','#b45309'], ['#34d399','#047857'],
  ['#60a5fa','#1d4ed8'], ['#a78bfa','#6d28d9'], ['#f472b6','#9d174d'],
  ['#2dd4bf','#0f766e'], ['#fb923c','#c2410c'], ['#818cf8','#3730a3'],
  ['#4ade80','#15803d'], ['#f87171','#991b1b'], ['#38bdf8','#0369a1']
];
function avHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h) % AV_PAIRS.length;
}
function avStyle(name) {
  const [a, b] = AV_PAIRS[avHash(name || '?')];
  return `--av1:${a};--av2:${b}`;
}

// ── E2EE (PBKDF2 → AES-256-GCM) ──
const ENC_VER = 'E1';
const ENC_SALT = 'sharedata/v1/ws-salt';
const ENC_ITER = 200000;
let cryptoKey = null;

function b64uEnc(u8) { let s=''; for(const b of u8) s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64uDec(s) { s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

async function deriveKey(pass) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(ENC_SALT), iterations: ENC_ITER, hash: 'SHA-256' },
    km,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt','decrypt']
  );
}

async function encField(plain) {
  if (!plain || !cryptoKey) return plain || '';
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv}, cryptoKey, new TextEncoder().encode(String(plain))));
  return ENC_VER + ':' + b64uEnc(iv) + ':' + b64uEnc(ct);
}

async function decField(s) {
  if (!s) return '';
  if (typeof s !== 'string' || !s.startsWith(ENC_VER + ':')) return s;
  if (!cryptoKey) return '🔒 cifrado';
  try {
    const [, ivb, ctb] = s.split(':');
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64uDec(ivb)}, cryptoKey, b64uDec(ctb));
    return new TextDecoder().decode(pt);
  } catch { return '🔒 no se pudo descifrar'; }
}

  for (let i = 0; i < isos.length; i += 2) ccByIso.set(isos.slice(i, i + 2), cc);
}

// País probable, sin consultar a nadie: primero lo que el usuario eligió antes,
// luego la zona horaria del dispositivo y por último el idioma del navegador.
function detectIso() {
  const guardado = localStorage.getItem('sd_cc');
  if (guardado && ccByIso.has(guardado)) return guardado;
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    const iso = isoByTz.get(tz.split('/').slice(1).join('/'));
    if (iso && ccByIso.has(iso)) return iso;
  } catch {}
  try {
    const r = new Intl.Locale(navigator.language || 'es').maximize().region;
    if (r && ccByIso.has(r)) return r;
  } catch {}
  return 'GT';   // donde vive el servidor
}

// ── Combobox de código de país ──
// Un <select> con 245 países obliga a recorrer la lista entera; esto filtra por
// nombre, código ISO o prefijo. Sin banderas: no se pintan igual en todos los
// sistemas y el prefijo es el dato que de verdad importa.
const ccNorm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

let ccItems = [];      // [{iso, cc, nombre, norm}]
let ccIso = null;      // país elegido
let ccVisibles = [];   // resultados del filtro actual
let ccActivo = -1;     // índice resaltado dentro de ccVisibles

function ccBuild() {
  let dn = null;
  try { dn = new Intl.DisplayNames([navigator.language || 'es'], {type: 'region'}); } catch {}
  ccItems = [...ccByIso].map(([iso, cc]) => {
    let nombre = iso;
    try { nombre = (dn && dn.of(iso)) || iso; } catch {}
    return { iso, cc, nombre, norm: ccNorm(nombre) };
  }).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}

// Ordena por lo específico que sea el acierto: primero coincidencias exactas de
// prefijo o ISO, luego los nombres que empiezan por el texto, luego el resto.
function ccFiltrar(q) {
  const t = ccNorm(q).replace(/^\+/, '').trim();
  if (!t) return ccItems;
  const esNumero = /^[0-9]+$/.test(t);
  const out = [];
  for (const it of ccItems) {
    let r = -1;
    if (esNumero) {
      if (it.cc === t) r = 0;
      else if (it.cc.startsWith(t)) r = 1;
    } else {
      const iso = it.iso.toLowerCase();
      if (iso === t) r = 0;
      else if (it.norm.startsWith(t)) r = 1;
      else if (iso.startsWith(t)) r = 2;
      else if (it.norm.includes(' ' + t)) r = 3;
      else if (it.norm.includes(t)) r = 4;
    }
    if (r >= 0) out.push({ it, r });
  }
  out.sort((a, b) => a.r - b.r || a.it.nombre.localeCompare(b.it.nombre, 'es'));
  return out.map(o => o.it);
}

function ccResalta(nombre, q) {
  const t = ccNorm(q).trim();
  if (!t) return esc(nombre);
  const i = ccNorm(nombre).indexOf(t);
  if (i < 0) return esc(nombre);
  return esc(nombre.slice(0, i)) + '<mark>' + esc(nombre.slice(i, i + t.length)) + '</mark>' + esc(nombre.slice(i + t.length));
}

function ccRender(q) {
  const lista = document.getElementById('ccList');
  ccVisibles = ccFiltrar(q);
  if (!ccVisibles.length) {
    lista.innerHTML = '<li class="cc-empty">Sin resultados</li>';
    ccActivo = -1;
    return;
  }
  ccActivo = Math.max(0, ccVisibles.findIndex(i => i.iso === ccIso));
  lista.innerHTML = ccVisibles.map((i, n) =>
    `<li class="cc-opt" role="option" id="cc-o${n}" data-iso="${i.iso}" aria-selected="${n === ccActivo}">`
    + `<span class="cc-opt-name">${ccResalta(i.nombre, q)}</span><span class="cc-opt-cc">+${i.cc}</span></li>`
  ).join('');
  ccScrollActivo();
}

function ccScrollActivo() {
  const lista = document.getElementById('ccList');
  const el = lista.children[ccActivo];
  if (!el || !el.scrollIntoView) return;
  const lt = lista.scrollTop, lb = lt + lista.clientHeight;
  if (el.offsetTop < lt) lista.scrollTop = el.offsetTop;
  else if (el.offsetTop + el.offsetHeight > lb) lista.scrollTop = el.offsetTop + el.offsetHeight - lista.clientHeight;
}

function ccMarcar(n) {
  const lista = document.getElementById('ccList');
  if (!ccVisibles.length) return;
  ccActivo = (n + ccVisibles.length) % ccVisibles.length;
  for (let k = 0; k < lista.children.length; k++) {
    lista.children[k].setAttribute('aria-selected', k === ccActivo);
  }
  document.getElementById('loginCC').setAttribute('aria-activedescendant', 'cc-o' + ccActivo);
  ccScrollActivo();
}

function ccAbrir() {
  const inp = document.getElementById('loginCC');
  ccRender(inp.dataset.q || '');
  document.getElementById('ccList').classList.add('open');
  inp.setAttribute('aria-expanded', 'true');
}

function ccCerrar() {
  const inp = document.getElementById('loginCC');
  document.getElementById('ccList').classList.remove('open');
  inp.setAttribute('aria-expanded', 'false');
  inp.removeAttribute('aria-activedescendant');
  inp.dataset.q = '';
  ccSet(ccIso);   // el campo vuelve a mostrar el prefijo, no lo tecleado
}

// Fija el país y deja el campo mostrando solo su prefijo.
function ccSet(iso) {
  if (!iso || !ccByIso.has(iso)) return;
  ccIso = iso;
  localStorage.setItem('sd_cc', iso);
  const inp = document.getElementById('loginCC');
  if (inp) inp.value = '+' + ccByIso.get(iso);
}

function ccElegir(iso) {
  ccSet(iso);
  ccCerrar();
  document.getElementById('loginPhone').focus();
}

function fillCCSelect() {
  const inp = document.getElementById('loginCC');
  const lista = document.getElementById('ccList');
  if (!inp || ccItems.length) return;
  ccBuild();
  ccSet(detectIso());

  inp.addEventListener('focus', () => { inp.dataset.q = ''; inp.select(); ccAbrir(); });
  inp.addEventListener('input', () => {
    inp.dataset.q = inp.value;
    ccRender(inp.value);
    document.getElementById('ccList').classList.add('open');
    inp.setAttribute('aria-expanded', 'true');
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); ccAbrir(); ccMarcar(ccActivo + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ccMarcar(ccActivo - 1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (ccVisibles[ccActivo]) ccElegir(ccVisibles[ccActivo].iso);
      else ccCerrar();
    }
    else if (e.key === 'Escape') { e.preventDefault(); ccCerrar(); }
    else if (e.key === 'Tab') ccCerrar();
  });
  // mousedown, no click: el blur del input se dispararía antes que el click.
  lista.addEventListener('mousedown', e => {
    const li = e.target.closest('.cc-opt');
    if (!li) return;
    e.preventDefault();
    ccElegir(li.dataset.iso);
  });
  inp.addEventListener('blur', () => setTimeout(ccCerrar, 0));
}

// El backend compara contra users.phone, que está en E.164 estricto: '+' y
// dígitos, sin espacios ni ceros de marcación nacional.
function phoneE164() {
  const raw = (document.getElementById('loginPhone').value || '').trim();
  const digitos = raw.replace(/\D/g, '');
  if (!digitos) return '';
  // Si escriben el número completo con '+', se respeta tal cual.
  if (raw.startsWith('+')) return '+' + digitos;
  const cc = ccByIso.get(ccIso) || '';
  return '+' + cc + digitos.replace(/^0+/, '');
}

// Reparte un E.164 guardado entre el código de país y el campo de número.
function setPhoneFields(e164) {
  const d = (e164 || '').replace(/\D/g, '');
  if (!d) return;
  const actual = ccByIso.get(ccIso);
  // Si el prefijo coincide con el país ya elegido, se respeta: evita que un +1
  // compartido por muchos países cambie la selección sin motivo.
  if (actual && d.startsWith(actual)) {
    document.getElementById('loginPhone').value = d.slice(actual.length);
    return;
  }
  for (let len = 3; len >= 1; len--) {
    const cc = d.slice(0, len);
    for (const [iso, c] of ccByIso) {
      if (c !== cc) continue;
      ccSet(iso);
      document.getElementById('loginPhone').value = d.slice(len);
      return;
    }
  }
  document.getElementById('loginPhone').value = d;
}

function getToken() { return localStorage.getItem('sd_token') || ''; }
function setToken(t) { localStorage.setItem('sd_token', t); }
function clearToken() { localStorage.removeItem('sd_token'); localStorage.removeItem('sd_phone'); }

async function api(url, opts={}) {
  opts.headers = opts.headers || {};
  const t = getToken();
  if (t) opts.headers['Authorization'] = 'Bearer ' + t;
  const r = await fetch(url, opts);
  if (r.status === 401) { clearToken(); showLogin(); throw new Error('Unauthorized'); }
  return r;
}

function showLogin() {
  document.getElementById('loginOverlay').classList.add('active');
  document.getElementById('loginStep1').style.display = '';
  document.getElementById('loginStep2').style.display = 'none';
  document.getElementById('loginStep3').style.display = 'none';
  document.getElementById('loginErr').classList.remove('show');
  setLoginStep(1);
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
}

function showUnlock() {
  document.getElementById('loginOverlay').classList.add('active');
  document.getElementById('loginStep1').style.display = 'none';
  document.getElementById('loginStep2').style.display = 'none';
  document.getElementById('loginStep3').style.display = '';
  document.getElementById('loginErr').classList.remove('show');
  document.getElementById('loginPass').value = '';
  setLoginStep(3);
  setTimeout(()=>document.getElementById('loginPass').focus(), 50);
}

function hideLogin() { document.getElementById('loginOverlay').classList.remove('active'); }

function loginErr(msg) {
  const e = document.getElementById('loginErr');
  e.textContent = msg;
  e.classList.remove('show');
  void e.offsetWidth;
  e.classList.add('show');
}

async function doLogin() {
  const phone = phoneE164();
  if (!phone) { loginErr('Ingresa un teléfono'); return; }   // ccSet ya guardó el país
  const btn = document.getElementById('loginSendBtn');
  btn.disabled = true; btn.textContent = 'Enviando...';
  document.getElementById('loginErr').classList.remove('show');
  try {
    const r = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
    if (!r.ok) {
      const t = await r.text();
      loginErr(t || 'Error');
      btn.disabled = false; btn.textContent = 'Enviar código';
      return;
    }
    localStorage.setItem('sd_phone', phone);
    document.getElementById('loginStep1').style.display = 'none';
    document.getElementById('loginStep2').style.display = '';
    document.getElementById('loginCode').value = '';
    setLoginStep(2);
    setTimeout(()=>document.getElementById('loginCode').focus(), 50);
  } catch(e) { loginErr('No se pudo contactar el servidor'); }
  btn.disabled = false; btn.textContent = 'Enviar código';
}

async function doVerify() {
  const phone = localStorage.getItem('sd_phone') || '';
  const code = document.getElementById('loginCode').value.trim();
  if (code.length !== 6) { loginErr('Código de 6 dígitos'); return; }
  const btn = document.getElementById('loginVerifyBtn');
  btn.disabled = true; btn.textContent = 'Verificando...';
  document.getElementById('loginErr').classList.remove('show');
  try {
    const r = await fetch('/api/auth/verify', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone, code})});
    if (!r.ok) {
      const t = await r.text();
      loginErr(t || 'Código inválido');
      btn.disabled = false; btn.textContent = 'Verificar';
      return;
    }
    const data = await r.json();
    setToken(data.token);
    document.getElementById('sessionPhone').textContent = data.phone;
    showUnlock();
  } catch(e) { loginErr('Error de red'); }
  btn.disabled = false; btn.textContent = 'Verificar';
}

async function doUnlock() {
  const pass = document.getElementById('loginPass').value;
  if (!pass) { loginErr('Ingresa la frase'); return; }
  const btn = document.getElementById('loginPassBtn');
  btn.disabled = true; btn.textContent = 'Derivando...';
  document.getElementById('loginErr').classList.remove('show');
  try {
    cryptoKey = await deriveKey(pass);
    sessionStorage.setItem('sd_pass', pass);
    document.getElementById('lockBadge').style.display = 'inline-flex';
    hideLogin();
    bootApp();
  } catch(e) { loginErr('Error derivando clave'); }
  btn.disabled = false; btn.textContent = 'Desbloquear';
}

function relock() {
  cryptoKey = null;
  sessionStorage.removeItem('sd_pass');
  document.getElementById('lockBadge').style.display = 'none';
  showUnlock();
}

function backToPhone() {
  document.getElementById('loginStep1').style.display = '';
  document.getElementById('loginStep2').style.display = 'none';
  document.getElementById('loginErr').classList.remove('show');
  setLoginStep(1);
}

function logout() {
  clearToken();
  cryptoKey = null;
  sessionStorage.removeItem('sd_pass');
  document.getElementById('lockBadge').style.display = 'none';
  showLogin();
}

// WS
function conn() {
  if (!getToken()) { showLogin(); return; }
  if (ws) { ws.onclose = null; ws.onerror = null; ws.onmessage = null; try { ws.close(); } catch(e) {} ws = null; }
  const W = `${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws?token=${encodeURIComponent(getToken())}`;
  ws = new WebSocket(W);
  ws.onopen = () => document.getElementById('statusDot').classList.remove('disconnected');
  ws.onclose = () => { document.getElementById('statusDot').classList.add('disconnected'); setTimeout(conn, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'new_message' && ev.message.channel_id === chId) addMsg(ev.message);
    else if (ev.type === 'messages_deleted' && ev.channel_id === chId) { loadMsgs(); toast('Mensajes eliminados'); }
    else if (ev.type === 'message_removed' && ev.message.channel_id === chId) {
      const el = document.querySelector(`.msg[data-id="${ev.message.id}"]`);
      if (el) { el.remove(); msgCache.delete(ev.message.id); fileCache.delete(ev.message.id); regroupMsgs(); chkEmpty(); }
    }
    else if (ev.type === 'channel_created' || ev.type === 'channel_updated') loadChs();
    else if (ev.type === 'channel_deleted') {
      if (ev.channel_id === chId) { chId = 1; localStorage.setItem('sd_ch','1'); loadMsgs(); }
      loadChs();
    }
    if (ev.type === 'channel_updated' && ev.channel?.id === chId) document.getElementById('headerTitle').textContent = ev.channel.name;
  };
}

// Channels
async function loadChs() {
  chs = await (await api('/api/channels')).json();
  const list = document.getElementById('chList');
  list.innerHTML = '';
  chs.forEach(c => {
    const d = document.createElement('div');
    d.className = 'ch-item' + (c.id === chId ? ' active' : '');
    d.onclick = e => { if (!e.target.closest('.ch-action')) switchCh(c.id); };

// ── PDF.js lazy loader + ID3 cover parser ──
let _pdfjs = null;
function ensurePdfJs() {
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; resolve(window.pdfjsLib); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _pdfjs;
}

function dataUrlToU8(dataUrl) {
  const b64 = dataUrl.split(',')[1] || '';
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

async function renderPdfThumb(m, container) {
  try {
    const lib = await ensurePdfJs();
    const pdf = await lib.getDocument({data: dataUrlToU8(m.file_data)}).promise;
    const page = await pdf.getPage(1);
    const vp1 = page.getViewport({scale: 1});
    const scale = Math.min(100/vp1.width, 100/vp1.height);
    const vp = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
    container.innerHTML = '';
    container.appendChild(canvas);
  } catch(e) { /* keep icon */ }
}

// Extract APIC cover from ID3v2 header (mp3/aac). Returns data URL or null.
function extractID3Cover(u8) {
  try {
    if (u8.length < 10) return null;
    if (String.fromCharCode(u8[0], u8[1], u8[2]) !== 'ID3') return null;
    const ver = u8[3];
    const tagSize = ((u8[6]&0x7f) << 21) | ((u8[7]&0x7f) << 14) | ((u8[8]&0x7f) << 7) | (u8[9]&0x7f);
    const end = Math.min(10 + tagSize, u8.length);
    let pos = 10;
    while (pos < end - 10) {
      const fid = String.fromCharCode(u8[pos], u8[pos+1], u8[pos+2], u8[pos+3]);
      if (fid.charCodeAt(0) === 0) break;
      let fsize;
      if (ver >= 4) {
        fsize = ((u8[pos+4]&0x7f) << 21) | ((u8[pos+5]&0x7f) << 14) | ((u8[pos+6]&0x7f) << 7) | (u8[pos+9]&0x7f);
      } else {
        fsize = (u8[pos+4] << 24) | (u8[pos+5] << 16) | (u8[pos+6] << 8) | u8[pos+7];
      }
      if (fid === 'APIC') {
        let p = pos + 10;
        const enc = u8[p++];
        let mimeEnd = p;
        while (mimeEnd < u8.length && u8[mimeEnd] !== 0) mimeEnd++;
        const mime = String.fromCharCode(...u8.slice(p, mimeEnd)) || 'image/jpeg';
        p = mimeEnd + 1;
        p++; // picture type
        if (enc === 1 || enc === 2) {
          while (p < u8.length - 1 && !(u8[p] === 0 && u8[p+1] === 0)) p += 2;
          p += 2;
        } else {
          while (p < u8.length && u8[p] !== 0) p++;
          p++;
        }
        const imgEnd = pos + 10 + fsize;
        const img = u8.slice(p, imgEnd);
        let bin = '';
        for (let i = 0; i < img.length; i++) bin += String.fromCharCode(img[i]);
        return `data:${mime.toLowerCase()};base64,${btoa(bin)}`;
      }
      pos += 10 + fsize;
      if (fsize <= 0) break;
    }
    return null;
  } catch { return null; }
}

async function renderAudioCover(m, container) {
  try {
    // Solo los primeros ~1MB para buscar ID3/APIC (el cover rara vez es mayor)
    const b64 = (m.file_data.split(',')[1] || '').slice(0, 1400000);
    if (!b64) return;
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const cover = extractID3Cover(u8);
    if (!cover) return;
    const img = new Image();
    img.onload = () => { container.innerHTML = ''; container.appendChild(img); };
    img.src = cover;
  } catch(e) { /* keep icon */ }
}
