<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ShareData</title>
<script>
(() => {
  const t = localStorage.getItem('sd_theme') || 'system';
  const resolved = t === 'system'
    ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : t;
  document.documentElement.dataset.theme = resolved;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root {
  color-scheme: dark;
  --bg: #0d0d12;
  --bg-elev: #12121a;
  --surface: #15151c;
  --surface2: #1c1c25;
  --surface3: #26262f;
  --surface-hover: rgba(255,255,255,0.035);
  --border: #26262f;
  --border2: #3a3a46;
  --border-strong: #58586a;
  --text: #f1f1f4;
  --text2: #b4b4c0;
  --text3: #7c7c8a;
  --gold: #d4b25e;
  --gold2: #e8ca7c;
  --gold-dim: rgba(212,178,94,0.09);
  --gold-dim2: rgba(212,178,94,0.20);
  --gold-glow: rgba(212,178,94,0.30);
  --on-gold: #0f0f14;
  --red: #ef5050;
  --red-dim: rgba(239,80,80,0.10);
  --red-border: rgba(239,80,80,0.38);
  --green: #3ecf8e;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.35);
  --shadow-sm: 0 2px 6px rgba(0,0,0,0.35);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.55);
  --ring: 0 0 0 3px var(--gold-glow);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
  --sidebar-w: 272px;
  --header-h: 56px;
  --t-fast: 120ms cubic-bezier(.4,0,.2,1);
  --t-base: 180ms cubic-bezier(.4,0,.2,1);
  --t-slow: 280ms cubic-bezier(.4,0,.2,1);
}

[data-theme="light"] {
  color-scheme: light;
  --bg: #f8f8f6;
  --bg-elev: #ffffff;
  --surface: #ffffff;
  --surface2: #f3f3f1;
  --surface3: #e9e9e6;
  --surface-hover: rgba(15,15,20,0.04);
  --border: #e4e4de;
  --border2: #cacac4;
  --border-strong: #8a8a84;
  --text: #18181b;
  --text2: #3a3a40;
  --text3: #72727c;
  --gold: #8a6a1f;
  --gold2: #a0812c;
  --gold-dim: rgba(138,106,31,0.07);
  --gold-dim2: rgba(138,106,31,0.15);
  --gold-glow: rgba(138,106,31,0.22);
  --on-gold: #ffffff;
  --red: #b91c1c;
  --red-dim: rgba(185,28,28,0.06);
  --red-border: rgba(185,28,28,0.30);
  --green: #047857;
  --shadow-xs: 0 1px 2px rgba(15,15,20,0.06);
  --shadow-sm: 0 2px 6px rgba(15,15,20,0.06);
  --shadow-md: 0 8px 24px rgba(15,15,20,0.08);
  --shadow-lg: 0 24px 60px rgba(15,15,20,0.14);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--gold-dim2); color: var(--text); }
html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11", "ss01", "ss03";
  letter-spacing: -0.005em;
}

button, input, textarea { font-family: inherit; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }

/* ============ SIDEBAR ============ */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 30;
  transition: transform var(--t-slow);
}

.sidebar-header {
  height: var(--header-h);
  padding: 0 14px 0 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.logo {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 9px;
}
.logo::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 10px var(--gold-glow);
}

#lockBadge {
  display: none;
  align-items: center;
  gap: 4px;
  color: var(--gold);
  padding: 3px 8px;
  background: var(--gold-dim);
  border: 1px solid var(--gold-dim2);
  border-radius: 999px;
  font-size: 10px;
  font-weight: 500;
  margin-left: auto;
}

.icon-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
  flex-shrink: 0;
}
.icon-btn:hover {
  color: var(--gold);
  background: var(--gold-dim);
  border-color: var(--gold-dim2);
}

.sidebar-section {
  padding: 14px 20px 4px;
  display: flex;
  align-items: center;
}
.sidebar-section-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 10px 8px;
  scrollbar-width: thin;
}
.sidebar-list::-webkit-scrollbar { width: 4px; }
.sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ch-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
  margin-bottom: 1px;
  position: relative;
}
.ch-item:hover { background: var(--surface2); }
.ch-item.active {
  background: var(--gold-dim);
}
.ch-item.active::before {
  content: '';
  position: absolute;
  left: -10px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: 0 2px 2px 0;
  background: var(--gold);
}

.ch-hash {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--text3);
  font-weight: 400;
  width: 14px;
  flex-shrink: 0;
  text-align: center;
  transition: color var(--t-fast);
}
.ch-item.active .ch-hash { color: var(--gold); }

.ch-name {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color var(--t-fast);
  letter-spacing: -0.005em;
}
.ch-item.active .ch-name,
.ch-item:hover .ch-name { color: var(--text); }

.ch-actions {
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--t-fast);
}
.ch-item:hover .ch-actions { opacity: 1; }

.ch-action {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--t-fast), background var(--t-fast);
}
.ch-action:hover { color: var(--text); background: var(--surface3); }
.ch-action.del:hover { color: var(--red); background: var(--red-dim); }

/* Sidebar footer */
.sidebar-footer {
  border-top: 1px solid var(--border);
  padding: 8px 10px 10px;
}
.session-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 6px;
  border-radius: 8px;
}
.session-ava {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  color: var(--on-gold);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  letter-spacing: 0;
  box-shadow: 0 2px 4px var(--gold-glow);
}
.session-phone {
  flex: 1;
  font-size: 11.5px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.session-actions { display: flex; gap: 4px; }
.session-btn {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.session-btn:hover { color: var(--text); background: var(--surface2); border-color: var(--border); }
.session-btn.danger:hover { color: var(--red); background: var(--red-dim); border-color: var(--red-border); }

/* ============ MAIN ============ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
  position: relative;
}

/* New messages indicator */
.new-msgs {
  position: absolute;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--gold);
  color: var(--on-gold);
  padding: 8px 14px 8px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  cursor: pointer;
  border: none;
  font-family: var(--font);
  box-shadow: var(--shadow-md), 0 0 0 4px var(--gold-glow);
  display: flex;
  align-items: center;
  gap: 7px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-base), transform var(--t-base);
  z-index: 20;
}
.new-msgs.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
  animation: newMsgPulse 1.6s ease-in-out infinite;
}
.new-msgs:hover { background: var(--gold2); }
.new-msgs svg { flex-shrink: 0; }
@keyframes newMsgPulse {
  0%, 100% { box-shadow: var(--shadow-md), 0 0 0 4px var(--gold-glow); }
  50% { box-shadow: var(--shadow-md), 0 0 0 10px transparent; }
}

.header {
  height: var(--header-h);
  padding: 0 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.menu-btn { display: none; }

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  position: relative;
  flex-shrink: 0;
  transition: background var(--t-base);
}
.status-dot::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: var(--green);
  opacity: 0.4;
  animation: pulse 2s ease-out infinite;
}
.status-dot.disconnected { background: var(--red); }
.status-dot.disconnected::after { background: var(--red); animation: none; opacity: 0.22; }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0; }
  50% { transform: scale(1.7); opacity: 0.35; }
}

.header-title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
}
.header-title::before {
  content: '#';
  color: var(--text3);
  margin-right: 5px;
  font-weight: 400;
  font-family: var(--mono);
  font-size: 14px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.name-input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 12px;
  width: 140px;
  outline: none;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.name-input::placeholder { color: var(--text3); }
.name-input:hover { border-color: var(--border2); }
.name-input:focus { border-color: var(--gold); background: var(--bg-elev); }

.toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  user-select: none;
  padding: 4px 8px;
  border-radius: 7px;
  transition: background var(--t-fast);
}
.toggle:hover { background: var(--surface2); }
.toggle-label {
  font-size: 10.5px;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
}
.toggle-track {
  width: 28px;
  height: 16px;
  border-radius: 999px;
  background: var(--surface3);
  border: 1px solid var(--border);
  position: relative;
  transition: background var(--t-base), border-color var(--t-base);
}
.toggle-track.on { background: var(--gold); border-color: var(--gold); }
.toggle-track::after {
  content: '';
  position: absolute;
  top: 1px;
  left: 1px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text2);
  transition: transform var(--t-base), background var(--t-base);
}
.toggle-track.on::after { transform: translateX(12px); background: var(--on-gold); }

.btn-clean {
  padding: 6px 10px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  font-size: 12px;
  cursor: pointer;
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-clean:hover {
  border-color: var(--red-border);
  color: var(--red);
  background: var(--red-dim);
}

/* ============ MESSAGES ============ */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.messages::-webkit-scrollbar-thumb:hover { background: var(--border2); }

.msg {
  display: flex;
  gap: 12px;
  padding: 7px 12px;
  border-radius: 8px;
  transition: background var(--t-fast);
  position: relative;
  animation: msgIn 180ms cubic-bezier(.4,0,.2,1);
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg:hover { background: var(--surface-hover); }
.msg:hover .msg-tools { opacity: 1; transform: translateY(0); }

.msg.grouped { padding-top: 1px; padding-bottom: 1px; margin-top: -2px; }
.msg.grouped .msg-ini { visibility: hidden; height: 0; align-self: center; }
.msg.grouped .msg-meta { display: none; }
.msg.grouped .msg-body::before {
  content: attr(data-time);
  position: absolute;
  left: 14px;
  top: 8px;
  font-size: 10px;
  color: var(--text3);
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity var(--t-fast);
  pointer-events: none;
}
.msg.grouped:hover .msg-body::before { opacity: 1; }

.msg-ini {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 11.5px;
  flex-shrink: 0;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--av1, #64748b), var(--av2, #334155));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10), 0 1px 2px rgba(0,0,0,0.25);
  letter-spacing: 0;
}

.msg-body { flex: 1; min-width: 0; position: relative; }
.msg-meta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}
.msg-user {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.005em;
}
.msg-time {
  font-size: 11px;
  color: var(--text3);
  font-variant-numeric: tabular-nums;
}
.msg-text {
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
}
.msg-text.is-large {
  max-height: 280px;
  overflow-y: auto;
  padding: 10px 12px;
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.6;
  margin-top: 4px;
}
.msg-img {
  margin-top: 6px;
  max-width: 420px;
  max-height: 400px;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: zoom-in;
  transition: opacity var(--t-fast);
  display: block;
}
.msg-img:hover { opacity: 0.92; }

.msg-attach {
  margin-top: 6px;
  padding: 8px 10px 8px 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text2);
  transition: border-color var(--t-fast);
  max-width: 440px;
  min-width: 240px;
}
.msg-attach:hover { border-color: var(--border2); }
.msg-attach-sz { color: var(--text3); font-variant-numeric: tabular-nums; flex-shrink: 0; font-size: 11px; }

.att-thumb {
  width: 50px;
  height: 50px;
  border-radius: 7px;
  flex-shrink: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--text3);
}
.att-thumb img, .att-thumb canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.att-thumb.pdf-thumb { background: #fff; }
[data-theme="light"] .att-thumb.pdf-thumb { background: #fff; }

.att-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.att-name {
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12.5px;
  letter-spacing: -0.005em;
}

.att-actions { display: flex; gap: 4px; flex-shrink: 0; }
.att-btn {
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font);
}
.att-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
.att-btn.primary { border-color: var(--gold); color: var(--gold); }
.att-btn.primary:hover { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }

.msg-audio-wrap {
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 440px;
}

.msg-tools {
  position: absolute;
  right: 10px;
  top: -6px;
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow-sm);
  opacity: 0;
  transform: translateY(-3px);
  transition: opacity var(--t-fast), transform var(--t-fast);
}
.msg-tool {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--t-fast), background var(--t-fast);
}
.msg-tool:hover { color: var(--text); background: var(--surface2); }
.msg-tool.del:hover { color: var(--red); background: var(--red-dim); }

/* ============ INPUT ============ */
.input-bar {
  padding: 12px 20px 16px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.file-preview {
  display: none;
  padding: 8px 12px;
  margin-bottom: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text2);
  align-items: center;
  gap: 10px;
}

/* ============ OVERLAYS ============ */
.drop-zone {

}

.drop-zone span {

  border-radius: 14px;

.lightbox {

}
.lightbox.active { display: flex; }

}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);

  justify-content: center;
}

.overlay.active { display: flex; animation: fadeIn var(--t-base); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  width: 360px;
  max-width: 92vw;

  animation: modalIn var(--t-slow);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal h3 {

}

.modal input[type="text"] {

  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;

}
.modal input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); }

.modal-opts {

}
.modal-opt {

  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  text-align: left;
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
}
.modal-opt:hover { border-color: var(--border2); color: var(--text); }
.modal-opt.sel { border-color: var(--red); color: var(--red); background: var(--red-dim); }

.modal-ft { display: flex; justify-content: flex-end; gap: 8px; }

.mbtn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast);
}
.mbtn:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }

.mbtn-gold {
  border-color: var(--gold);
  background: var(--gold);
  color: var(--on-gold);
}
.mbtn-gold:hover { background: var(--gold2); border-color: var(--gold2); color: var(--on-gold); }

.mbtn-red {
  border-color: var(--red);
  color: var(--red);
}
.mbtn-red:hover:not(:disabled) { background: var(--red); color: #fff; border-color: var(--red); }
.mbtn-red:disabled { opacity: 0.5; cursor: not-allowed; }

/* Toast */
.toast {
  position: fixed;
  bottom: 88px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 500;
  opacity: 0;
  transition: opacity var(--t-slow), transform var(--t-slow);
  pointer-events: none;
  z-index: 400;
  box-shadow: var(--shadow-md);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Empty */
.empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  gap: 8px;
  font-size: 13px;
}
.empty-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);

  align-items: center;
  justify-content: center;
  color: var(--text3);

}
.empty-title { font-weight: 500; color: var(--text2); font-size: 13.5px; }
.empty-sub { font-size: 12px; color: var(--text3); }

/* Mobile backdrop */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
  z-index: 25;
}
.sidebar-backdrop.active { display: block; }

/* Mobile */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);

  }

  .menu-btn { display: flex; }
  .header { padding: 0 14px; }
  .messages { padding: 12px 14px; }

}

/* ============ LOGIN ============ */
.login {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.login.active { display: flex; }
.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 28px 26px;
  box-shadow: var(--shadow-lg);
}
.login-logo {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text);
  text-align: center;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.login-logo::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold-glow);
}
.login-sub {
  text-align: center;
  color: var(--text3);
  font-size: 12px;
  margin-bottom: 22px;
}
.login-steps {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 26px;
}
.login-steps span {
  width: 28px;
  height: 3px;
  border-radius: 2px;
  background: var(--surface3);
  transition: background var(--t-base), width var(--t-base);
}
.login-steps span.done { background: var(--gold); }
.login-steps span.active { background: var(--gold); width: 36px; }

.login-field {
  display: block;
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  font-weight: 500;
}
.login-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.login-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-glow); }
.login-input.code {
  text-align: center;
  letter-spacing: 0.4em;
  font-size: 22px;
  font-family: var(--mono);
  padding: 14px;
}
.login-btn {
  width: 100%;
  margin-top: 18px;
  padding: 12px;
  background: var(--gold);
  color: var(--on-gold);
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background var(--t-fast), transform var(--t-fast);
  box-shadow: 0 2px 8px var(--gold-glow);
}
.login-btn:hover:not(:disabled) { background: var(--gold2); transform: translateY(-1px); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.login-link {
  display: block;
  margin: 12px auto 0;
  background: none;
  border: none;
  color: var(--text3);
  font-size: 12px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 6px;
  transition: color var(--t-fast), background var(--t-fast);
}
.login-link:hover { color: var(--gold); background: var(--gold-dim); }
.login-err {
  margin-top: 14px;
  padding: 10px 12px;
  background: var(--red-dim);
  border: 1px solid var(--red-border);
  border-radius: 8px;
  color: var(--red);
  font-size: 12px;
  display: none;
}
.login-err.show { display: block; animation: shake 400ms ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-4px); }
  40%, 80% { transform: translateX(4px); }
}

/* ============ THEME SWITCHER ============ */
.theme-seg {
  display: flex;
  gap: 2px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  margin: 8px 10px 4px;
}
.theme-opt {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text3);
  padding: 6px 0;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast);
}
.theme-opt:hover { color: var(--text2); }
.theme-opt.active {
  background: var(--bg-elev);
  color: var(--gold);
  box-shadow: var(--shadow-xs);
}

/* ============ CONTEXT MENU ============ */
.ctx-menu {
  position: fixed;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  min-width: 220px;
  max-width: 280px;
  box-shadow: var(--shadow-lg);
  z-index: 500;
  display: none;
  animation: ctxIn 120ms cubic-bezier(.4,0,.2,1);
}
.ctx-menu.active { display: block; }
@keyframes ctxIn {
  from { opacity: 0; transform: scale(0.97) translateY(-3px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.ctx-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  font-size: 13px;
  color: var(--text2);
  border-radius: 6px;
  cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
  user-select: none;
  line-height: 1.1;
}
.ctx-item:hover { background: var(--surface2); color: var(--text); }
.ctx-item.danger:hover { background: var(--red-dim); color: var(--red); }
.ctx-item svg { flex-shrink: 0; color: var(--text3); transition: color var(--t-fast); }
.ctx-item:hover svg { color: currentColor; }
.ctx-item span.lbl { flex: 1; }
.ctx-item .hint {
  font-size: 10.5px;
  color: var(--text3);
  font-family: var(--mono);
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 2px 5px;
  border-radius: 4px;
}
.ctx-sep { height: 1px; background: var(--border); margin: 4px 4px; }

/* ============ PENDING / SPIN ============ */
.spin {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
  display: inline-block;
  flex-shrink: 0;
}
.spin.sm { width: 10px; height: 10px; border-width: 1.5px; }
@keyframes spin { to { transform: rotate(360deg); } }

.msg.pending { opacity: 0.72; }
.msg.pending .msg-text { color: var(--text2); }
.msg.pending .pending-time {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text3);
  font-style: italic;
}
.msg.pending.failed { opacity: 0.58; }
.msg.pending.failed .msg-ini { filter: grayscale(1); }
.msg.pending.failed .pending-time { color: var(--red); font-style: normal; }
.msg.pending.failed .pending-time .spin { display: none; }
.pending-attach {
  background: var(--surface);
  border: 1px dashed var(--border2) !important;
}

/* ============ AUDIO / VIDEO ============ */
.msg-audio {
  display: block;
  margin-top: 6px;
  width: 360px;
  max-width: 100%;
  height: 40px;
}
.msg-audio::-webkit-media-controls-panel { background: var(--surface2); }
.msg-video {
  display: block;
  margin-top: 6px;
  max-width: 420px;
  max-height: 400px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #000;
}

/* kebab = single hover/tap trigger */
.msg-tool.kebab { color: var(--text2); }
.msg-tool.kebab:hover { color: var(--gold); background: var(--gold-dim); }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .status-dot::after { display: none; }
}

// ── Theme ──
function setTheme(mode) {

function applyTheme() {

  const resolved = mode === 'system'
    ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    : mode;
  document.documentElement.dataset.theme = resolved;
  document.querySelectorAll('.theme-opt').forEach(b => b.classList.toggle('active', b.dataset.t === mode));

// ── Login step indicator ──
function setLoginStep(n) {
  const steps = document.querySelectorAll('#loginSteps span');
  steps.forEach((s, i) => {
    s.classList.remove('active', 'done');
    if (i + 1 < n) s.classList.add('done');
    else if (i + 1 === n) s.classList.add('active');

// ── Avatar gradient (deterministic hash) ──
const AV_PAIRS = [
  ['#fb7185','#be123c'], ['#fbbf24','#b45309'], ['#34d399','#047857'],
  ['#60a5fa','#1d4ed8'], ['#a78bfa','#6d28d9'], ['#f472b6','#9d174d'],
  ['#2dd4bf','#0f766e'], ['#fb923c','#c2410c'], ['#818cf8','#3730a3'],
  ['#4ade80','#15803d'], ['#f87171','#991b1b'], ['#38bdf8','#0369a1']
];
function avHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  return Math.abs(h) % AV_PAIRS.length;
}
function avStyle(name) {
  const [a, b] = AV_PAIRS[avHash(name || '?')];
  return `--av1:${a};--av2:${b}`;
}

// ── E2EE (PBKDF2 → AES-256-GCM) ──
const ENC_VER = 'E1';
const ENC_SALT = 'sharedata/v1/ws-salt';
const ENC_ITER = 200000;
let cryptoKey = null;

function b64uEnc(u8) { let s=''; for(const b of u8) s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64uDec(s) { s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }

async function deriveKey(pass) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(ENC_SALT), iterations: ENC_ITER, hash: 'SHA-256' },
    km,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt','decrypt']
  );
}

async function encField(plain) {
  if (!plain || !cryptoKey) return plain || '';
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv}, cryptoKey, new TextEncoder().encode(String(plain))));
  return ENC_VER + ':' + b64uEnc(iv) + ':' + b64uEnc(ct);
}

async function decField(s) {
  if (!s) return '';
  if (typeof s !== 'string' || !s.startsWith(ENC_VER + ':')) return s;
  if (!cryptoKey) return '🔒 cifrado';
  try {
    const [, ivb, ctb] = s.split(':');
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64uDec(ivb)}, cryptoKey, b64uDec(ctb));
    return new TextDecoder().decode(pt);
  } catch { return '🔒 no se pudo descifrar'; }
}

// ── Auth ──
function getToken() { return localStorage.getItem('sd_token') || ''; }
function setToken(t) { localStorage.setItem('sd_token', t); }
function clearToken() { localStorage.removeItem('sd_token'); localStorage.removeItem('sd_phone'); }

async function api(url, opts={}) {
  opts.headers = opts.headers || {};
  const t = getToken();
  if (t) opts.headers['Authorization'] = 'Bearer ' + t;
  const r = await fetch(url, opts);
  if (r.status === 401) { clearToken(); showLogin(); throw new Error('Unauthorized'); }
  return r;
}

function showLogin() {
  document.getElementById('loginOverlay').classList.add('active');

}

  document.getElementById('loginOverlay').classList.add('active');

async function doLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  if (!phone) { loginErr('Ingresa un teléfono'); return; }
  const btn = document.getElementById('loginSendBtn');
  btn.disabled = true; btn.textContent = 'Enviando...';
  document.getElementById('loginErr').classList.remove('show');
  try {
    const r = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
    if (!r.ok) {
      const t = await r.text();
      loginErr(t || 'Error');
      btn.disabled = false; btn.textContent = 'Enviar código';
      return;
    }
    localStorage.setItem('sd_phone', phone);
    document.getElementById('loginStep1').style.display = 'none';
    document.getElementById('loginStep2').style.display = '';
    document.getElementById('loginCode').value = '';
    setLoginStep(2);
    setTimeout(()=>document.getElementById('loginCode').focus(), 50);
  } catch(e) { loginErr('No se pudo contactar el servidor'); }
  btn.disabled = false; btn.textContent = 'Enviar código';
}

async function doVerify() {
  const phone = localStorage.getItem('sd_phone') || '';
  const code = document.getElementById('loginCode').value.trim();
  if (code.length !== 6) { loginErr('Código de 6 dígitos'); return; }
  const btn = document.getElementById('loginVerifyBtn');
  btn.disabled = true; btn.textContent = 'Verificando...';
  document.getElementById('loginErr').classList.remove('show');
  try {
    const r = await fetch('/api/auth/verify', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone, code})});
    if (!r.ok) {
      const t = await r.text();
      loginErr(t || 'Código inválido');
      btn.disabled = false; btn.textContent = 'Verificar';
      return;
    }
    const data = await r.json();
    setToken(data.token);
    document.getElementById('sessionPhone').textContent = data.phone;
    showUnlock();
  } catch(e) { loginErr('Error de red'); }
  btn.disabled = false; btn.textContent = 'Verificar';
}

async function doUnlock() {
  const pass = document.getElementById('loginPass').value;
  if (!pass) { loginErr('Ingresa la frase'); return; }
  const btn = document.getElementById('loginPassBtn');
  btn.disabled = true; btn.textContent = 'Derivando...';
  document.getElementById('loginErr').classList.remove('show');
  try {
    cryptoKey = await deriveKey(pass);
    sessionStorage.setItem('sd_pass', pass);
    document.getElementById('lockBadge').style.display = 'inline-flex';
    hideLogin();
    bootApp();

  btn.disabled = false; btn.textContent = 'Desbloquear';
}

function relock() {
  cryptoKey = null;
  sessionStorage.removeItem('sd_pass');
  document.getElementById('lockBadge').style.display = 'none';

}

// WS
function conn() {
  if (!getToken()) { showLogin(); return; }
  if (ws) { ws.onclose = null; ws.onerror = null; ws.onmessage = null; try { ws.close(); } catch(e) {} ws = null; }
  const W = `${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws?token=${encodeURIComponent(getToken())}`;
  ws = new WebSocket(W);
  ws.onopen = () => document.getElementById('statusDot').classList.remove('disconnected');
  ws.onclose = () => { document.getElementById('statusDot').classList.add('disconnected'); setTimeout(conn, 2000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'new_message' && ev.message.channel_id === chId) addMsg(ev.message);
    else if (ev.type === 'messages_deleted' && ev.channel_id === chId) { loadMsgs(); toast('Mensajes eliminados'); }
    else if (ev.type === 'message_removed' && ev.message.channel_id === chId) {
      const el = document.querySelector(`.msg[data-id="${ev.message.id}"]`);
      if (el) { el.remove(); msgCache.delete(ev.message.id); regroupMsgs(); chkEmpty(); }
    }
    else if (ev.type === 'channel_created' || ev.type === 'channel_updated') loadChs();
    else if (ev.type === 'channel_deleted') {
      if (ev.channel_id === chId) { chId = 1; localStorage.setItem('sd_ch','1'); loadMsgs(); }
      loadChs();
    }
    if (ev.type === 'channel_updated' && ev.channel?.id === chId) document.getElementById('headerTitle').textContent = ev.channel.name;
  };
}

// ── PDF.js lazy loader + ID3 cover parser ──
let _pdfjs = null;
function ensurePdfJs() {
  if (_pdfjs) return _pdfjs;
  _pdfjs = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; resolve(window.pdfjsLib); };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return _pdfjs;
}

function dataUrlToU8(dataUrl) {
  const b64 = dataUrl.split(',')[1] || '';
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

async function renderPdfThumb(m, container) {
  try {
    const lib = await ensurePdfJs();
    const pdf = await lib.getDocument({data: dataUrlToU8(m.file_data)}).promise;
    const page = await pdf.getPage(1);
    const vp1 = page.getViewport({scale: 1});
    const scale = Math.min(100/vp1.width, 100/vp1.height);
    const vp = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
    container.innerHTML = '';
    container.appendChild(canvas);
  } catch(e) { /* keep icon */ }
}

// Extract APIC cover from ID3v2 header (mp3/aac). Returns data URL or null.
function extractID3Cover(u8) {
  try {
    if (u8.length < 10) return null;
    if (String.fromCharCode(u8[0], u8[1], u8[2]) !== 'ID3') return null;
    const ver = u8[3];
    const tagSize = ((u8[6]&0x7f) << 21) | ((u8[7]&0x7f) << 14) | ((u8[8]&0x7f) << 7) | (u8[9]&0x7f);
    const end = Math.min(10 + tagSize, u8.length);
    let pos = 10;
    while (pos < end - 10) {
      const fid = String.fromCharCode(u8[pos], u8[pos+1], u8[pos+2], u8[pos+3]);
      if (fid.charCodeAt(0) === 0) break;
      let fsize;
      if (ver >= 4) {
        fsize = ((u8[pos+4]&0x7f) << 21) | ((u8[pos+5]&0x7f) << 14) | ((u8[pos+6]&0x7f) << 7) | (u8[pos+9]&0x7f);
      } else {
        fsize = (u8[pos+4] << 24) | (u8[pos+5] << 16) | (u8[pos+6] << 8) | u8[pos+7];
      }
      if (fid === 'APIC') {
        let p = pos + 10;
        const enc = u8[p++];
        let mimeEnd = p;
        while (mimeEnd < u8.length && u8[mimeEnd] !== 0) mimeEnd++;
        const mime = String.fromCharCode(...u8.slice(p, mimeEnd)) || 'image/jpeg';
        p = mimeEnd + 1;
        p++; // picture type
        if (enc === 1 || enc === 2) {
          while (p < u8.length - 1 && !(u8[p] === 0 && u8[p+1] === 0)) p += 2;
          p += 2;
        } else {
          while (p < u8.length && u8[p] !== 0) p++;
          p++;
        }
        const imgEnd = pos + 10 + fsize;
        const img = u8.slice(p, imgEnd);
        let bin = '';
        for (let i = 0; i < img.length; i++) bin += String.fromCharCode(img[i]);
        return `data:${mime.toLowerCase()};base64,${btoa(bin)}`;
      }
      pos += 10 + fsize;
      if (fsize <= 0) break;
    }
    return null;
  } catch { return null; }
}

async function renderAudioCover(m, container) {
  try {
    // Solo los primeros ~1MB para buscar ID3/APIC (el cover rara vez es mayor)
    const b64 = (m.file_data.split(',')[1] || '').slice(0, 1400000);
    if (!b64) return;
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const cover = extractID3Cover(u8);
    if (!cover) return;
    const img = new Image();
    img.onload = () => { container.innerHTML = ''; container.appendChild(img); };
    img.src = cover;
  } catch(e) { /* keep icon */ }
}

const _defer = window.requestIdleCallback ? (fn => requestIdleCallback(fn, {timeout: 800})) : (fn => setTimeout(fn, 20));

function renderThumbs(m, root) {
  try {
    const kind = fileKind(m);
    if (kind === 'pdf') {
      const el = root.querySelector('.pdf-thumb');
      if (el) _defer(() => { try { renderPdfThumb(m, el); } catch(e) {} });
    } else if (kind === 'audio') {
      const el = root.querySelector('.audio-cover');
      if (el) _defer(() => { try { renderAudioCover(m, el); } catch(e) {} });
    }
  } catch(e) { /* never block addMsg */ }
}

function fileKind(m) {
  if (!m.has_file) return null;
  const ext = (m.file_name||'').split('.').pop().toLowerCase();
  const data = m.file_data || '';
  if (data.startsWith('data:image/')) return 'image';
  if (data.startsWith('data:audio/') || ['mp3','wav','ogg','m4a','aac','flac','opus'].includes(ext)) return 'audio';
  if (data.startsWith('data:video/') || ['mp4','mov','webm','mkv','avi'].includes(ext)) return 'video';
  if (ext === 'pdf' || data.startsWith('data:application/pdf')) return 'pdf';
  if (['doc','docx','xls','xlsx','ppt','pptx','odt','ods','rtf','txt','csv','md','json','xml','html'].includes(ext)) return 'doc';
  return 'file';
}

// data:URL → blob URL para abrir en pestaña
function dataToBlobUrl(dataUrl) {
  try {
    const [head, b64] = dataUrl.split(',');
    const mime = (head.match(/:(.*?);/) || [,'application/octet-stream'])[1];
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], {type: mime}));
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return url;
  } catch { return null; }
}

function openInTab(m) {
  const url = dataToBlobUrl(m.file_data);
  if (url) window.open(url, '_blank'); else toast('No se pudo abrir');
}
function openHere(m) {
  if (fileKind(m) === 'image') {
    document.getElementById('lbImg').src = m.file_data;
    document.getElementById('lb').classList.add('active');
  } else {
    const url = dataToBlobUrl(m.file_data);
    if (url) window.open(url, '_self'); else toast('No se pudo abrir');
  }
}
async function copyLink(m) {
  try { await navigator.clipboard.writeText(m.file_name || ''); toast('Nombre copiado'); }
  catch { toast('No se pudo copiar'); }
}

// ── Context menu ──
let ctxTarget = null;
function buildCtxItems(m) {
  const items = [];
  const kind = fileKind(m);

  if (m.content) items.push({ i: 'copy', l: 'Copiar texto', a: () => cpTxt(m.id) });

  if (kind === 'image') {
    items.push({ i: 'image', l: 'Copiar imagen', a: () => cpImg(m.id) });
    items.push({ i: 'expand', l: 'Ver tamaño completo', a: () => openHere(m) });
    items.push({ i: 'external', l: 'Abrir en nueva pestaña', a: () => openInTab(m) });
    items.push({ i: 'download', l: 'Descargar', a: () => dl(m.file_name, m.file_data) });
  } else if (kind === 'audio') {
    items.push({ i: 'play', l: 'Abrir reproductor', a: () => openInTab(m) });
    items.push({ i: 'download', l: 'Descargar audio', a: () => dl(m.file_name, m.file_data) });
    items.push({ i: 'copy', l: 'Copiar nombre', a: () => copyLink(m) });
  } else if (kind === 'video') {
    items.push({ i: 'play', l: 'Reproducir en pestaña', a: () => openInTab(m) });
    items.push({ i: 'download', l: 'Descargar video', a: () => dl(m.file_name, m.file_data) });
  } else if (kind === 'pdf') {
    items.push({ i: 'open', l: 'Abrir PDF', a: () => openInTab(m) });
    items.push({ i: 'download', l: 'Descargar', a: () => dl(m.file_name, m.file_data) });
    items.push({ i: 'copy', l: 'Copiar nombre', a: () => copyLink(m) });
  } else if (kind === 'doc' || kind === 'file') {
    items.push({ i: 'download', l: 'Descargar', a: () => dl(m.file_name, m.file_data) });
    items.push({ i: 'external', l: 'Abrir en nueva pestaña', a: () => openInTab(m) });
    items.push({ i: 'copy', l: 'Copiar nombre', a: () => copyLink(m) });
  }

  if (items.length) items.push({ sep: true });
  items.push({ i: 'trash', l: 'Eliminar mensaje', a: () => delMsg(m.id), danger: true });
  return items;
}

function showCtxMenu(m, x, y) {
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = '';
  ctxTarget = m;
  for (const it of buildCtxItems(m)) {
    if (it.sep) { const s = document.createElement('div'); s.className = 'ctx-sep'; menu.appendChild(s); continue; }
    const b = document.createElement('div');
    b.className = 'ctx-item' + (it.danger ? ' danger' : '');
    b.innerHTML = `${ICONS[it.i]}<span class="lbl">${it.l}</span>`;
    b.onclick = () => { hideCtxMenu(); it.a(); };
    menu.appendChild(b);
  }
  menu.classList.add('active');
  menu.style.left = '0px'; menu.style.top = '0px';
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  const vw = innerWidth, vh = innerHeight;
  menu.style.left = Math.max(6, Math.min(x, vw - mw - 8)) + 'px';
  menu.style.top  = Math.max(6, Math.min(y, vh - mh - 8)) + 'px';
}
function hideCtxMenu() { document.getElementById('ctxMenu').classList.remove('active'); ctxTarget = null; }

// ── Messages ──
async function loadMsgs() {
  const data = await (await api(`/api/messages?channel_id=${chId}&limit=500`)).json();
  const box = document.getElementById('msgBox');
  box.innerHTML = '';
  msgCache.clear();
  hideNewMsgs();
  if (data.messages?.length) {
    for (const m of data.messages) await addMsg(m, false);
    regroupMsgs();
    scrollEnd();
  } else chkEmpty();
}

function regroupMsgs() {
  const box = document.getElementById('msgBox');
  const msgs = box.querySelectorAll('.msg:not(.pending)');
  msgs.forEach(el => {
    const p = el.previousElementSibling;
    if (p && p.classList.contains('msg') && !p.classList.contains('pending') && p.dataset.user === el.dataset.user) {
      const dtDelta = +el.dataset.ts - +p.dataset.ts;
      el.classList.toggle('grouped', dtDelta >= 0 && dtDelta < 5 * 60 * 1000);
    } else {
      el.classList.remove('grouped');
    }
  });
}

async function addMsg(m, scroll=true) {
  if (document.querySelector(`.msg[data-id="${m.id}"]`)) return;
  m = {...m,
    content: await decField(m.content),
    file_name: m.file_name ? await decField(m.file_name) : '',
    file_data: m.file_data ? await decField(m.file_data) : '',
  };
  msgCache.set(m.id, m);
  const wasPending = consumePendingFor(m);

  const box = document.getElementById('msgBox');
  const wasNearBottom = isNearBottom();
  const emp = document.getElementById('emptyState');
  if (emp) emp.remove();
  const d = document.createElement('div');
  d.className = 'msg';
  d.dataset.id = m.id;
  d.dataset.user = m.username;
  d.dataset.ts = new Date(m.created_at).getTime();
  const ini = m.username.substring(0,2);
  const ts = new Date(m.created_at);
  const t = ts.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
  const dt = ts.toLocaleDateString('es',{day:'numeric',month:'short'});
  const big = m.content?.length > 500;
  const kind = fileKind(m);

  const MUSIC_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  const PDF_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><text x="7" y="18" font-size="6" fill="#dc2626" stroke="none" font-family="sans-serif" font-weight="700">PDF</text></svg>';
  const FILE_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

  let file = '';
  if (m.has_file && m.file_name) {
    if (kind === 'image') {
      file = `<img class="msg-img" src="${m.file_data}" loading="lazy" data-mid="${m.id}">`;
    } else if (kind === 'audio') {
      file = `<div class="msg-audio-wrap" data-mid="${m.id}"><div class="msg-attach audio-preview"><div class="att-thumb audio-cover" data-mid="${m.id}">${MUSIC_ICON}</div><div class="att-info"><span class="att-name">${esc(m.file_name)}</span><span class="att-sz msg-attach-sz">${fmtSz(m.file_size)}</span></div><div class="att-actions"><button class="att-btn primary" data-act="dl" data-mid="${m.id}">Descargar</button></div></div><audio class="msg-audio" controls preload="none" src="${m.file_data}"></audio></div>`;
    } else if (kind === 'video') {
      file = `<video class="msg-video" controls preload="metadata" src="${m.file_data}"></video>`;
    } else if (kind === 'pdf') {
      file = `<div class="msg-attach" data-mid="${m.id}"><div class="att-thumb pdf-thumb" data-mid="${m.id}">${PDF_ICON}</div><div class="att-info"><span class="att-name">${esc(m.file_name)}</span><span class="att-sz msg-attach-sz">${fmtSz(m.file_size)}</span></div><div class="att-actions"><button class="att-btn primary" data-act="open" data-mid="${m.id}">Abrir</button><button class="att-btn" data-act="dl" data-mid="${m.id}">Descargar</button></div></div>`;
    } else {
      file = `<div class="msg-attach" data-mid="${m.id}"><div class="att-thumb">${FILE_ICON}</div><div class="att-info"><span class="att-name">${esc(m.file_name)}</span><span class="att-sz msg-attach-sz">${fmtSz(m.file_size)}</span></div><div class="att-actions"><button class="att-btn" data-act="open" data-mid="${m.id}">Abrir</button><button class="att-btn primary" data-act="dl" data-mid="${m.id}">Descargar</button></div></div>`;
    }
  }

  const kebab = `<button class="msg-tool kebab" data-mid="${m.id}" title="Opciones">${ICONS.kebab}</button>`;

  d.innerHTML = `<div class="msg-ini" style="${avStyle(m.username)}">${esc(ini)}</div><div class="msg-body" data-time="${t}"><div class="msg-meta"><span class="msg-user">${esc(m.username)}</span><span class="msg-time">${dt} · ${t}</span></div>${m.content?`<div class="msg-text${big?' is-large':''}">${esc(m.content)}</div>`:''}${file}</div><div class="msg-tools">${kebab}</div>`;

  // append: newest at bottom
  box.appendChild(d);

  // Async thumbnail rendering (pdf first page / audio cover art)
  if (m.has_file) renderThumbs(m, d);

  // Group check against previous (older) sibling
  const p = d.previousElementSibling;
  if (p && p.classList.contains('msg') && !p.classList.contains('pending') && p.dataset.user === m.username) {
    const dtDelta = +d.dataset.ts - +p.dataset.ts;
    if (dtDelta >= 0 && dtDelta < 5 * 60 * 1000) d.classList.add('grouped');
  }

  if (scroll) {
    if (wasPending || wasNearBottom) scrollEnd();
    else { newMsgCount++; showNewMsgs(); }
  }
}

// Event delegation on msgBox for kebab / image click / attachment / contextmenu / long-press
(function wireMsgBox(){
  const box = document.getElementById('msgBox');
  let lpTimer = null, lpFired = false;

  box.addEventListener('click', e => {
    const kb = e.target.closest('.msg-tool.kebab');
    if (kb) {
      e.stopPropagation();
      const id = +kb.dataset.mid;
      const m = msgCache.get(id);
      if (!m) return;
      const r = kb.getBoundingClientRect();
      showCtxMenu(m, r.right - 220, r.bottom + 4);
      return;
    }
    const img = e.target.closest('.msg-img');
    if (img) {
      document.getElementById('lbImg').src = img.src;
      document.getElementById('lb').classList.add('active');
      return;
    }
    const actBtn = e.target.closest('.att-btn');
    if (actBtn) {
      e.preventDefault();
      const id = +actBtn.dataset.mid;
      const m = msgCache.get(id);
      if (!m) return;
      const act = actBtn.dataset.act;
      if (act === 'open') openInTab(m);
      else if (act === 'dl') dl(m.file_name, m.file_data);
    }
  });

  box.addEventListener('contextmenu', e => {
    const msg = e.target.closest('.msg:not(.pending)');
    if (!msg) return;
    e.preventDefault();
    const m = msgCache.get(+msg.dataset.id);
    if (m) showCtxMenu(m, e.clientX, e.clientY);
  });

  // Long-press for mobile
  box.addEventListener('touchstart', e => {
    const msg = e.target.closest('.msg:not(.pending)');
    if (!msg) return;
    lpFired = false;
    const t = e.touches[0];
    lpTimer = setTimeout(() => {
      const m = msgCache.get(+msg.dataset.id);
      if (m) { showCtxMenu(m, t.clientX, t.clientY); lpFired = true; if (navigator.vibrate) navigator.vibrate(15); }
    }, 450);
  }, { passive: true });
  box.addEventListener('touchmove', () => { clearTimeout(lpTimer); });
  box.addEventListener('touchend', e => { clearTimeout(lpTimer); if (lpFired) e.preventDefault(); });
  box.addEventListener('touchcancel', () => clearTimeout(lpTimer));
})();

// ── Pending / ghost rows ──
function addPendingRow(user, content, file) {
  const box = document.getElementById('msgBox');
  const emp = document.getElementById('emptyState');
  if (emp) emp.remove();
  const d = document.createElement('div');
  d.className = 'msg pending';
  const ini = user.substring(0,2);
  let fileHtml = '';
  if (file) {
    fileHtml = `<div class="msg-attach pending-attach"><span class="spin sm"></span><span>${esc(file.name)}</span><span class="msg-attach-sz">${fmtSz(file.size)}</span></div>`;
  }
  d.innerHTML = `<div class="msg-ini" style="${avStyle(user)}">${esc(ini)}</div><div class="msg-body"><div class="msg-meta"><span class="msg-user">${esc(user)}</span><span class="msg-time pending-time"><span class="spin sm"></span>Enviando${file?' archivo':''}...</span></div>${content?`<div class="msg-text">${esc(content)}</div>`:''}${fileHtml}</div>`;
  box.appendChild(d);
  return d;
}

function consumePendingFor(m) {
  const idx = pending.findIndex(p =>
    p.user === m.username &&
    p.hasFile === !!m.has_file &&
    p.size === (m.file_size || 0)
  );
  if (idx < 0) return false;
  const p = pending[idx];
  clearTimeout(p.timer);
  p.el.remove();
  pending.splice(idx, 1);
  return true;
}

// ── Send ──
async function send() {
  const inp = document.getElementById('msgInput');
  const txt = inp.value.trim();
  const user = document.getElementById('nameInput').value.trim() || 'Anónimo';
  if (!txt && !pFile) return;
  if (!cryptoKey) { toast('Desbloquea el cifrado primero'); showUnlock(); return; }

  const file = pFile;
  const pEl = addPendingRow(user, txt, file);
  const entry = { user, hasFile: !!file, size: file?.size || 0, el: pEl, timer: null };
  entry.timer = setTimeout(() => {
    if (pending.includes(entry)) {
      pEl.classList.add('failed');
      const tl = pEl.querySelector('.pending-time'); if (tl) tl.textContent = 'Se tardó demasiado';
      toast('El envío está tardando mucho');
    }
  }, 180000);
  pending.push(entry);

  inp.value = ''; inp.style.height = 'auto'; rmFile();
  scrollEnd();

  try {
    const cTxt = await encField(txt);
    const cName = file ? await encField(file.name) : '';
    const cData = file ? await encField(file.data) : '';
    if (!(ws?.readyState === 1)) throw new Error('WS disconnected');
    ws.send(JSON.stringify({type:'new_message',message:{channel_id:chId,username:user,content:cTxt,has_file:!!file,file_name:cName,file_size:file?.size||0,file_data:cData}}));
  } catch(e) {
    clearTimeout(entry.timer);
    const idx = pending.indexOf(entry); if (idx >= 0) pending.splice(idx, 1);
    pEl.classList.add('failed');
    const tl = pEl.querySelector('.pending-time'); if (tl) tl.textContent = 'Error al enviar';
    toast('Error enviando');
    setTimeout(() => pEl.remove(), 4000);
  }
}

// Files
function onFile(inp) {
  const f = inp.files[0]; if (!f) return;
  if (f.size > 20*1024*1024) { toast('Max 20MB'); inp.value=''; return; }
  const r = new FileReader();
  r.onload = () => setFile(f.name, f.size, r.result);
  r.readAsDataURL(f); inp.value='';
}

function setFile(name, size, data) {
  pFile = {name,size,data};
  const p = document.getElementById('filePrev');
  const old = p.querySelector('img'); if (old) old.remove();
  if (data.startsWith('data:image/')) { const i=document.createElement('img'); i.src=data; p.insertBefore(i,p.firstChild); }
  document.getElementById('fpName').textContent = name;
  document.getElementById('fpSize').textContent = fmtSz(size);
  p.classList.add('active');
}

function rmFile() {
  pFile = null;
  const p = document.getElementById('filePrev');
  p.classList.remove('active');
  const i = p.querySelector('img'); if (i) i.remove();
}

function dl(name, url) { const a=document.createElement('a'); a.href=url; a.download=name; a.click(); }

// Paste
document.addEventListener('paste', e => {
  for (const it of (e.clipboardData?.items||[])) {
    if (it.type.startsWith('image/')) {
      e.preventDefault();
      const f = it.getAsFile(); if (!f) return;
      if (f.size > 20*1024*1024) { toast('Max 20MB'); return; }
      const r = new FileReader();
      r.onload = () => setFile(`screenshot_${Date.now()}.${f.type.split('/')[1]||'png'}`, f.size, r.result);
      r.readAsDataURL(f); return;
    }
  }
});

// Copy
async function cpTxt(id) {
  const el = document.querySelector(`[data-id="${id}"] .msg-text`);
  if (!el) return;
  try { await navigator.clipboard.writeText(el.textContent); toast('Texto copiado'); }
  catch { const t=document.createElement('textarea'); t.value=el.textContent; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); toast('Texto copiado'); }
}

async function cpImg(id) {
  const img = document.querySelector(`[data-id="${id}"] .msg-img`);
  if (!img) return;
  try {
    const b = await (await fetch(img.src)).blob();
    const bm = await createImageBitmap(b);
    const c = document.createElement('canvas'); c.width=bm.width; c.height=bm.height;
    c.getContext('2d').drawImage(bm,0,0);
    c.toBlob(async pb => {
      try { await navigator.clipboard.write([new ClipboardItem({'image/png':pb})]); toast('Imagen copiada'); }
      catch { toast('No se pudo copiar'); }
    },'image/png');
  } catch { toast('No se pudo copiar'); }
}

// New-messages floating indicator
let newMsgCount = 0;
function showNewMsgs() {
  const b = document.getElementById('newMsgsBtn');
  const lbl = document.getElementById('newMsgsLabel');
  lbl.textContent = newMsgCount > 1 ? `${newMsgCount} nuevos mensajes` : 'Nuevo mensaje';
  b.classList.add('show');
}
function hideNewMsgs() {
  newMsgCount = 0;
  document.getElementById('newMsgsBtn').classList.remove('show');
}
document.getElementById('newMsgsBtn').addEventListener('click', () => { scrollEnd(); hideNewMsgs(); });
document.getElementById('msgBox').addEventListener('scroll', () => { if (isNearBottom()) hideNewMsgs(); }, { passive: true });
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtSz(b) { return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'; }
function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

// Enter toggle
let enterSend = localStorage.getItem('sd_enter')==='true';
const tt = document.getElementById('toggleTrack');
function updToggle() { tt.classList.toggle('on',enterSend); }
updToggle();
document.getElementById('enterToggle').onclick = () => { enterSend=!enterSend; localStorage.setItem('sd_enter',enterSend); updToggle(); };

// Textarea
const ta = document.getElementById('msgInput');
ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,180)+'px'; });
ta.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    if (enterSend && !e.shiftKey) { e.preventDefault(); send(); }
    else if (!enterSend && (e.ctrlKey||e.metaKey)) { e.preventDefault(); send(); }
  }
});

// Modal kbd
document.getElementById('newChName').addEventListener('keydown', e => { if(e.key==='Enter')doNewChat(); if(e.key==='Escape')closeModal('newChModal'); });
document.getElementById('renameVal').addEventListener('keydown', e => { if(e.key==='Enter')doRename(); if(e.key==='Escape')closeModal('renameModal'); });

// Drag & Drop
let dc = 0;
const dz = document.getElementById('dropZone');
document.addEventListener('dragenter', e => { e.preventDefault(); dc++; if(dc===1) dz.classList.add('active'); });
document.addEventListener('dragleave', e => { e.preventDefault(); dc--; if(dc===0) dz.classList.remove('active'); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); dc=0; dz.classList.remove('active');
  const f=e.dataTransfer?.files?.[0]; if(!f) return;
  if(f.size>20*1024*1024){toast('Max 20MB');return;}
  const r=new FileReader(); r.onload=()=>setFile(f.name,f.size,r.result); r.readAsDataURL(f);
});

// Username — auto-asigna un nombre icónico de ciencia/tecnología (persistente por navegador)
const SCI_TECH_NAMES = [
  'Ada Lovelace','Alan Turing','Grace Hopper','Nikola Tesla','Albert Einstein',
  'Marie Curie','Isaac Newton','Stephen Hawking','Richard Feynman','Linus Torvalds',
  'Dennis Ritchie','Ken Thompson','Tim Berners-Lee','Bjarne Stroustrup','Guido van Rossum',
  'Donald Knuth','Edsger Dijkstra','Claude Shannon','John von Neumann','Alan Kay',
  'Vint Cerf','Douglas Engelbart','Rosalind Franklin','Hedy Lamarr','Margaret Hamilton',
  'Katherine Johnson','Radia Perlman','Frances Allen','Carl Sagan','Jane Goodall',
  'Charles Darwin','Galileo Galilei','Johannes Kepler','James Maxwell','Michael Faraday',
  'Erwin Schrödinger','Werner Heisenberg','Niels Bohr','Lise Meitner','Emmy Noether',
  'Kurt Gödel','Leonhard Euler','Srinivasa Ramanujan','Carl Gauss','Steve Wozniak',
  'Dennis Hassabis','Geoffrey Hinton','Yann LeCun','Yoshua Bengio','Shafi Goldwasser'
];
const ni = document.getElementById('nameInput');
let _storedUser = localStorage.getItem('sd_user');
if (!_storedUser) {
  _storedUser = SCI_TECH_NAMES[Math.floor(Math.random() * SCI_TECH_NAMES.length)];
  localStorage.setItem('sd_user', _storedUser);
}
ni.value = _storedUser;
ni.addEventListener('input', () => localStorage.setItem('sd_user', ni.value));

// Session avatar from phone
function updSessionAva() {
  const phone = localStorage.getItem('sd_phone') || '';
  const ava = document.getElementById('sessionAva');
  if (phone) {
    const last2 = phone.slice(-2);
    ava.textContent = last2;
  }
}

// Init
function bootApp() {
  hideLogin();
  const saved = localStorage.getItem('sd_phone');
  if (saved) document.getElementById('sessionPhone').textContent = saved;
  updSessionAva();
  document.getElementById('lockBadge').style.display = cryptoKey ? 'inline-flex' : 'none';
  conn(); loadChs(); loadMsgs();
}

async function initAuth() {
  if (!getToken()) { showLogin(); return; }
  const savedPass = sessionStorage.getItem('sd_pass');
  if (savedPass) {
    try {
      cryptoKey = await deriveKey(savedPass);
      bootApp();
      return;
    } catch {}
  }
  showUnlock();
}
initAuth();

document.getElementById('loginPhone').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
document.getElementById('loginCode').addEventListener('keydown', e => { if (e.key==='Enter') doVerify(); });
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key==='Enter') doUnlock(); });
document.getElementById('loginCode').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,6);
  if (e.target.value.length === 6) doVerify();
});
const savedPhone = localStorage.getItem('sd_phone');
if (savedPhone) document.getElementById('loginPhone').value = savedPhone;
</script>
